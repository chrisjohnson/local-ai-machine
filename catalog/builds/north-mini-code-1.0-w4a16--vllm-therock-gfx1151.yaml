  notes: 'Smoke-tested 2026-07-27 (real docker run, not the orchestrator) — fails to load on this hardware.
    Two distinct issues found, in the order hit: (1) `--reasoning-parser cohere_command4` (present in
    the model''s own HF README invocation) fails immediately: `ImportError: The Cohere reasoning parser
    requires the cohere_melody package, which is not installed` — this toolbox image''s vLLM build doesn''t
    ship it. Dropped from build_specific_flags above since it''s a hard import failure, not optional.
    (2) Even without that flag, the model still fails during weight loading with `NotImplementedError:
    No NvFp4 MoE backend supports the deployment configuration.` — despite the repo name/quantization
    field saying "w4a16", this model''s MoE layers are internally NVFP4-formatted, an NVIDIA-specific
    FP4 format requiring NVIDIA Blackwell-class matrix-core hardware. This AMD/gfx1151 box''s vLLM build
    has no NvFp4 kernel backend at all — same class of hard-blocker as the FP8 checkpoint issue already
    documented for other models on this hardware (see the primary''s own build notes on FP8), not something
    fixable via flags or the cohere_melody package. Full traceback captured, confirms this is the root
    cause (not the earlier import error, not a memory issue, not a benchmark-orchestrator quirk). Root-caused
    via `docker logs` on a manually-run (non---rm) container after the benchmark orchestrator''s own --tail
    100 log capture scrolled the real error out — worth knowing if this needs debugging again: `scripts/swap_model_start.sh`
    only captures the last 100 lines on failure, which isn''t enough for a model that gets deep into weight
    loading before crashing. Likely not fixable on this hardware without a different (non-NVFP4) build
    of this model, if one exists — not investigated further, out of scope for a smoke test.

    '
