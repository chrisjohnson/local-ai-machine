notes: >
  Healthy in ~190s at startup. Best concurrency headroom of any model tested
  (28.10x @65536) until GPT-OSS-20B later beat it (30.02x). Six-tier harness
  10/13 — Tier J loss (judge_incorrect, same recurring miss as other models),
  Tier D loss (debug_off_by_one — used range(len(orders)-1), silently
  dropping the last element instead of following the explicit multi-turn
  instruction, a genuine instruction-following carelessness not a harness
  artifact). Not a drop-in primary replacement on speed, but a real MTP
  candidate (glm4_moe_lite_mtp.py ships a dedicated MTP variant in this
  vLLM build — not yet attempted).
