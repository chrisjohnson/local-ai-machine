  role: 'M-055 ROCm control build. The community measured 73.5-90.6% DFlash draft
    acceptance on a ROCm/HIP build of this fork; this image reproduces that exact
    config on gfx1151 to decide whether M-053''s 10-19% Vulkan acceptance collapse was
    backend-specific. Result: TESTED_NOT_VIABLE — the control never got DFlash serving.
    On the same pinned fork commit (04b2b72), the ROCm/HIP build (a) fails to create
    the DFlash draft context during memory fitting ("failed to create llama_context
    from model", the ctx_other DFlash requirement) and the full server load then hangs
    at ~551MiB RSS with no further output; and (b) even a PLAIN (no-draft) 68GB load
    stalls after weight paging (~51GiB RSS, CPU spin, no output in 8+ min, unresponsive
    to SIGTERM). The community''s ROCm acceptance numbers are therefore not
    reproducible on this box with this toolchain. Combined with the Vulkan sweep
    (tunable but a wash, tops out at the 30.0 tok/s plain baseline), DFlash is a dead
    end on this hardware on either backend. All three M-050 speculative-decoding
    options are now resolved: serve Laguna-S-2.1 plain (30.0 tok/s, full 131072
    context).'
  notes: 'Custom image `local-ai-machine/llamacpp-laguna-fork:rocm-7.14` built from
    `docker/llamacpp-laguna-fork-rocm.dockerfile` (base rocm/dev-ubuntu-24.04:
    7.14.0-full — same ROCm 7.14 release as the box''s kyuz0 toolbox runtime — so the
    HIP SDK is version-matched). Fork pinned to the IDENTICAL commit as the Vulkan
    build (04b2b72) for a clean backend A/B. GGML_HIP=ON, AMDGPU_TARGETS=gfx1151,
    -j6. Build took ~3 min once the base image was in hand (the 8GB base download was
    the slow part; a pre-`docker pull` of the base DEADLOCKED the build''s FROM step —
    see engine recipe gotchas).

    Two runtime fixes were baked in during bring-up: (1) ROCm 7.14 keeps its libs under
    /opt/rocm/core-7.14/lib, not the loader''s default paths, so the freshly-linked
    binaries failed with `cannot open shared object file: libhipblas.so.3`; fixed by
    registering every /opt/rocm lib dir via ldconfig in the Dockerfile and baking the
    cache into the image. (2) `-fa 0` required under ROCm (flash attention crashes
    gfx1151 without rocWMMA, community-reported and consistent with the HIP arch 1300
    compile error); the control ran with `-fa 0` exactly as the community did.

    The control never produced a benchmark payload: the server never reached healthy at
    -c 131072 (the bench script''s first rung). Evidence and exact log lines in
    catalog/raw/laguna-rocm-control-2026-08-02/EVIDENCE.md. Host restored to pre-task
    state after the attempt (standing laguna back up and healthy, ds4 imatrix download
    resumed, no stray containers).

    '
