  role: 'M-050 experiment. Recorded as a real docker-compose.yml service for
    reproducibility/future re-evaluation (per Chris''s standing instruction that
    every build gets a compose entry even if not currently in use), but NOT
    currently pointed at by any litellm role and not recommended for standing
    use given the negative result below. Laguna-XS-2.1
    (33B/3B-active, already on disk from M-049) tested as a classic llama.cpp `-md`/
    `--spec-type draft-simple` speculative-decoding draft model for Laguna-S-2.1
    (118B/8B-active). Net result: NEGATIVE -- tokenizer/vocab is compatible (both
    models loaded and speculative decoding actively engaged, confirmed via real
    draft-acceptance telemetry), but real generation throughput came in BELOW the
    existing 30.0 tok/s plain Laguna-S-2.1 baseline at every context length tested.
    Do not point a role at this service; kept as a documented negative result per
    M-050''s own framing (a clean "no" is exactly as valuable as a "yes" here).'
  notes: 'Defined in docker-compose.yml as
    laguna-s-2.1-118b-q4km--llamacpp-vulkan-radv-speculative-xs-v1 (port 8107,
    -c 8192 -- the highest context that loaded/served stably in testing, see
    below) so the exact tested configuration is reproducible later, even though
    the real benchmark result was negative and no role currently points at it.
    The original hands-on testing in this session used ad-hoc `docker run`
    invocations (not this compose service directly) to iterate through the
    failure modes below before landing on the working config now captured in
    compose. Same trusted
    image every other llama.cpp service in this repo uses
    (docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv), stock llama.cpp, no
    custom build, no new download -- both Laguna-S-2.1 and Laguna-XS-2.1 were
    already fully present on disk before this experiment (/var/lib/ai-models/laguna-s-2.1-118b-q4km,
    /var/lib/ai-models/laguna-xs-2.1-33b-q4km).

    Tokenizer/vocab compatibility: CONFIRMED COMPATIBLE, contrary to the card''s
    open question. Both target and draft loaded cleanly with `-md
    /models-xs/Laguna-XS-2.1-Q4_K_M.gguf` and no rejection at any point -- no
    vocab-mismatch error of any kind was ever raised by llama.cpp across five
    separate container runs at four different context sizes. This rules out the
    "clean fast no" outcome the card anticipated for a tokenizer mismatch; the
    real result is a throughput/memory-budget negative instead.

    First real finding, not in the card: passing `-md <draft.gguf>` ALONE is not
    sufficient to actually engage speculative decoding on this llama.cpp build
    (`b10154 / 0e4a03622 (10154)`, matches the image build used for the plain
    Laguna-S-2.1 and Laguna-XS-2.1 catalog entries exactly) -- `--spec-type
    draft-simple` must also be passed explicitly (`--spec-type` defaults to
    `none`). Without it, the draft model loads into memory (consuming VRAM/GTT
    for nothing) but is never invoked -- no `draft_n`/`draft_n_accepted` fields
    appear in `/v1/chat/completions` response timings, and no `draft acceptance
    = ...` log lines appear at all. Confirmed both misconfigured (no
    `--spec-type`) and correctly configured (`--spec-type draft-simple`) runs
    side by side to isolate this.

    Second real finding: this box cannot fit BOTH models'' full KV caches at the
    baseline''s `-c 131072` context. At `-c 131072` (exactly matching the plain
    Laguna-S-2.1 compose service''s flags, per the card''s own base-flags
    instruction), both GGUFs loaded fully into memory but then failed at KV-cache
    buffer allocation (`radv/amdgpu: Failed to allocate a buffer: size:
    1073741824 bytes ... domains: 4`, repeated 3x) and the container was
    SIGKILLed (exit 137) shortly after -- consistent with an OOM condition, not a
    driver crash. At `-c 16384` the failure became a harder crash
    (`vk::DeviceLostError`/`ErrorDeviceLost`, exit 139) during model load itself,
    before either model finished initializing its KV cache. This build''s host is
    a Strix Halo APU (unified memory) -- `mem_info_vram_total` reports a fixed
    1GiB dedicated-VRAM heap (`/sys/class/drm/card1/device/mem_info_vram_total`
    = 1073741824 bytes, matching the exact failed-allocation size above) with the
    much larger 126GB GTT pool (carved from the 124GB system RAM pool via
    `amdgpu.gttsize=126976` in configuration.nix) used for the bulk of GPU
    allocations -- the plain single-model Laguna-S-2.1 baseline fits fine within
    this scheme at `-c 131072`; adding a second full model (33B/3B-active, not a
    purpose-built tiny draft) plus its own KV cache pushed some specific
    allocation class over the small fixed-VRAM-heap ceiling. No
    `--ctx-size-draft`/`-cd`-equivalent flag exists on this llama-server build to
    give the draft model a smaller independent context (checked via `--help`) --
    the `-c` value applies to both models. Reduced context was the only lever
    available; `-c 8192` was the highest tested value that loaded and ran stably
    across all benchmark requests (confirmed via `n_ctx_slot = 8192` in server
    logs and multiple successful generations, including one long-context request
    using the full slot).

    Real benchmark (see benchmark_runs below): even at the smaller `-c 8192`
    context -- itself already a real handicap relative to the 131072-context
    plain baseline, since a fair comparison would ideally use the same context
    size -- generation throughput measured 16.9-28.1 tok/s across four fresh
    (non-cache-hit) prompts, averaging ~21.7 tok/s across the three short-prompt
    samples and dropping further to 16.9 tok/s at ~7.1k prompt tokens. This is
    BELOW the existing plain Laguna-S-2.1 baseline of 30.0 tok/s at every point
    measured, despite draft acceptance rates of 40.8-72.4% (not low in absolute
    terms -- more than half of drafted tokens were typically accepted). The
    draft model (33B total / 3B active) is simply too heavy to draft fast enough
    to pay for itself against this specific target -- consistent with the
    card''s own stated risk ("XS is a full capable model, not a purpose-built
    tiny draft"). This matches the qualitative shape of the community-reported
    DFlash numbers cited in the card''s Context section (~19-26 tok/s,
    also below this box''s own 30.0 tok/s plain baseline) even though the
    mechanism here (classic autoregressive `-md` draft-simple) is unrelated to
    DFlash''s diffusion-based approach.

    Conclusion: Laguna-XS-2.1 is not a viable classic speculative-decoding draft
    for Laguna-S-2.1 on this box. Tokenizer compatibility is real and confirmed,
    but that alone isn''t sufficient -- the draft model is too slow/heavy
    relative to the verification savings it provides, and the combined
    memory footprint additionally forces a much smaller context window than the
    proven single-model baseline. Recommend continuing to serve Laguna-S-2.1
    plain (existing 30.0 tok/s baseline, full 131072 context) rather than paired
    with this draft model. The original benchmark used ad-hoc `docker run`
    instances (stopped and removed after the run); the exact tested config has
    since been captured as a real docker-compose.yml service
    (laguna-s-2.1-118b-q4km--llamacpp-vulkan-radv-speculative-xs-v1, port 8107)
    so it stays reproducible for the future even though nothing currently
    points a role at it and it is not recommended for standing use.

    '
