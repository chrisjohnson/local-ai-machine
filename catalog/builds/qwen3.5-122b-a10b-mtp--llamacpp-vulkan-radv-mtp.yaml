  role: MTP speculative-decoding counterpart to qwen3.5-122b-a10b--llamacpp-vulkan-radv,
    same UD-Q5_K_XL quant tier (chosen specifically to make this a clean same-quant
    A/B comparison, per M-048). MTP-tensor-bearing GGUF from a separate unsloth
    repo (unsloth/Qwen3.5-122B-A10B-MTP-GGUF).
  notes: '--spec-type draft-mtp --spec-draft-n-max 3 per llama.cpp PR #22673, matching
    the flags already proven on qwen3.6-35b-a3b-mtp. MTP requires -np/--parallel 1
    (single server slot only) — confirmed in server logs (`n_slots = 1, kv_unified
    = ''false''`) alongside `common_speculative_init_result: creating MTP draft
    context against the target model`.

    llama-bench does not support --spec-type/MTP flags at all (confirmed via
    --help, no spec/draft/mtp flags present), so this cannot use the standard
    llamacpp-bench-v1 pp512/tg128 harness. Benchmarked instead via direct
    llama-server request timing (`timings` block in the /v1/chat/completions
    response), against a live-server instance — benchmark_id llamacpp-live-request-v1,
    not blended with llamacpp-bench-v1. The non-MTP counterpart
    (qwen3.5-122b-a10b--llamacpp-vulkan-radv) was re-measured with the identical
    live-request methodology (see its own benchmark_runs) specifically so this
    comparison is apples-to-apples rather than comparing a llama-bench number
    against a live-request number.

    Two prompts run per variant: a short prompt (30 prompt tokens) and a long-context
    prompt (7845 prompt tokens, ~44KB of filler text ending in a summarization
    question) to see whether the speedup holds as context grows. Both requests
    capped at max_tokens=400 (finish_reason: length in both cases — this is a
    reasoning model that was still inside <think> content at the cutoff, but
    that does not affect the tok/s measurement, which is per-token timing from
    llama-server''s own instrumentation, not dependent on reaching a natural stop).

    Result: MTP gave a real, substantial speedup that HELD UP (in fact strengthened
    slightly) at long context — draft acceptance rate stayed high (85-89%) in
    both cases:
      - short prompt (30 tok prompt): plain 21.90 tok/s -> MTP 35.63 tok/s (+62.7%),
        draft_n_accepted 286/336 (85.1%)
      - long context (7845 tok prompt): plain 21.18 tok/s -> MTP 35.38 tok/s (+67.0%),
        draft_n_accepted 290/327 (88.7%)
    Prompt-processing (prefill) speed was essentially unaffected by MTP (257-268
    tok/s either way, as expected — MTP only accelerates the decode/generation
    phase). Conclusion: MTP is a clear win for this model+quant tier, worth
    keeping as the standing choice over the plain variant for generation-heavy
    workloads, with no observed degradation at ~8K context.'
