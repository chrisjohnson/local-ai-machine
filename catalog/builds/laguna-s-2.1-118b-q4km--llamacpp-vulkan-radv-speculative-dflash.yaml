    checkpoint''s custom `DFlashLagunaForCausalLM` architecture (6 sliding-
    attention layers, block_size 16, purpose-built for poolside''s DFlash
    block-diffusion decode loop) -- it appears to recognize enough metadata to
    attempt a tensor count validation, but the loader''s tensor-counting logic
    for this architecture disagrees with what''s actually present in the file
    (expects 76, finds 69), and refuses to proceed. This is consistent with the
    card''s own framing going in: real conversion/loader support for this
    architecture only exists in poolside''s own (explicitly off-limits, separate
