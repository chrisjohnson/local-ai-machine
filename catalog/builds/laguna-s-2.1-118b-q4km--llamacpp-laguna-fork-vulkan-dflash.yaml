  role: 'M-086 experiment: quantize the DFlash draft model itself (BF16 -> Q4_K_M
    / Q8_0) using the fork''s own `llama-quantize` binary (built into the SAME
    Vulkan image as v1 — target ``llama-quantize`` was not among the original
    build''s cmake targets, so it was compiled in-place inside a running
    container against the existing configured build dir; the shipped image
    digest is unchanged, sha256:98819738b785eb3d2c02b428a70e6a5e9d8c3da3b46d9cc2f1589766963169be,
    same as v1/M-053/M-055). Rationale: M-055''s sweep isolated the DFlash
    regression to a fixed ~2GB-per-block-step BF16 draft-weight-fetch tax on a
    bandwidth-constrained APU; quantizing the draft to ~600MB-1.1GB cuts that
    fixed cost ~2-3.5x, which could tip the already-competitive n2/n3 configs
    (matching the 30 tok/s baseline in BF16) above it instead of just matching
    it. Result: TESTED_VIABLE for Q4_K_M at spec-draft-n-max 2 — 33.06-34.77
    tok/s, a genuine +10-16% over the 30.0 tok/s plain baseline, the first
    config across the whole M-050/M-053/M-055/M-086 DFlash investigation to
    actually beat plain decoding rather than merely match it. Q4_K_M n3 lands
    just above baseline (30.57-31.44 tok/s); Q8_0 n2-n4 land at/slightly above
    baseline but with more sample-to-sample variance and no clear win over
    Q4_K_M. NOT added to docker-compose.yml as a standing service yet — this
    result needs a longer/more-varied prompt validation pass before being
    trusted as a serving default (2 short prompts x 2 samples per config is a
    smoke-test sample size, not a serving-decision sample size), and DFlash
    experiments on this box have deliberately never gotten a standing compose
    entry (ad-hoc `docker run` only, matching the DS4/M-051 precedent) — flagged
    to Chris as a candidate if he wants to promote it after a fuller validation
    pass.'
  notes: 'Same image/engine as v1 (`local-ai-machine/llamacpp-laguna-fork:vulkan-radv`,
    digest unchanged) and the SAME target model shards — only the DRAFT model file
    changes. Two quantized drafts were produced from
    `/var/lib/ai-models/laguna-s-2.1-dflash-draft/laguna-s-2.1-DFlash-BF16.gguf`
    (2126.77 MiB, 16.00 BPW) via the fork''s own `llama-quantize` (required —
