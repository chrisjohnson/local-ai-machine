    Both stored at /var/lib/ai-models/laguna-s-2.1-dflash-draft-quant/ on the box
    (laguna-s-2.1-DFlash-Q4_K_M.gguf, laguna-s-2.1-DFlash-Q8_0.gguf).

    Sweep methodology matches M-055''s exactly (scripts/benchmark-laguna-dflash.sh,
    extended in this card with DRAFT_MODEL_DIR/DRAFT_MODEL_FILE env overrides so
    the same script drives both quantized drafts without code duplication), run
    at full -c 131072 context, -fa 1, 2 short fresh prompts per config (MAX_TOKENS=256).
    All 7 sweep points ran back-to-back inside a single stop/restore cycle of the
    standing services (scripts/build artifacts + a one-off sweep wrapper, not
    committed — see catalog/raw/dflash-quant-sweep-2026-08-06/ for the raw
    per-config JSON responses) to avoid paying the ~5-10 min per-invocation
    stop/restore cost 7 times.

    Full sweep table (tok/s range across 2 short samples; acceptance = draft_n_accepted/draft_n):

      | draft    | n_max | tok/s range   | acceptance range | vs BF16 (M-055, same n_max)      |
      |----------|-------|---------------|-------------------|-----------------------------------|
      | Q4_K_M   | 15    | 8.16-9.40     | 9.2-13.2%         | 7.9-11.5 tok/s, 10-19% (no change) |
      | Q4_K_M   | 4     | 27.50-28.75   | 31.6-33.7%        | 24.8-27.1 tok/s, 31-38% (small gain) |
      | Q4_K_M   | 3     | 30.57-31.44   | 38.9-42.5%        | 27.1-30.9 tok/s, 39-49% (now consistently >= baseline) |
      | Q4_K_M   | 2     | 33.06-34.77   | 54.1-55.4%        | 27.7-30.1 tok/s, 48-55% (BEATS baseline by 10-16%) |
      | Q8_0     | 15    | 8.37-9.06     | 9.7-11.3%          | (no change) |
      | Q8_0     | 4     | 27.37-28.99   | 32.3-35.7%        | (small gain, ~matches Q4_K_M n4) |
      | Q8_0     | 3     | 28.91-31.10   | 37.6-43.9%        | (roughly matches baseline, more variance than Q4_K_M) |
      | Q8_0     | 2     | 30.50-32.19   | 47.5-54.5%        | (at/slightly above baseline, but below Q4_K_M n2) |

    Findings: (a) quantizing the draft has NO effect at n15 — the block-diffusion
    all-or-nothing acceptance collapse at large block sizes is not a memory-bandwidth
    effect, confirming M-055''s read that acceptance is a block-size effect, not a
    precision effect. (b) at the already-competitive n2-n4 range, shrinking the
    draft''s per-block-step weight-fetch cost (BF16 ~2.1GB -> Q4_K_M ~0.6GB, a
    ~3.5x reduction) measurably helps: Q4_K_M n2 is the ONLY config in the entire
    DFlash investigation (M-050/M-053/M-055/M-086) to clear the 30.0 tok/s plain
    baseline with margin, not just tie it. (c) Q8_0 (a smaller ~1.9x reduction vs
    BF16) shows the same directional improvement but doesn''t clear the baseline
    as cleanly or consistently as Q4_K_M — the extra precision does not buy back
    enough acceptance to offset its larger per-step weight-fetch cost. (d) sample
    size caveat: 2 short prompts x 2 samples per config (matching this sweep''s
    time budget) is enough to see a clear directional signal but is NOT a
    serving-grade validation sample — recommend a longer/more varied prompt set
    (short + long-context, more repeats) before treating Q4_K_M n2 as a serving
    default.

    Host restored to pre-task state after the full sweep: standing laguna-s-2.1-118b-q4km-v2
    and qwen3.6-35b-a3b-mtp-v2 compose services back up and healthy (confirmed via
    /health on their actual current ports), no leftover laguna-dflash-test container,
    no downloads left paused, box repo clean.'
