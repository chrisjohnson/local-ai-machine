  role: 'M-053 experiment (M-050 option 1 — the one untried candidate: poolside''s
    llama.cpp fork branch `laguna` built with Vulkan instead of the community''s
    ROCm/HIP). Result: TESTED_NOT_VIABLE. The fork builds cleanly with Vulkan
    (after bounded toolchain fixes), DFlash initializes and serves at the full
    -c 131072 baseline context, BUT real generation throughput is ~9.3 tok/s
    (3 short samples: 7.98 / 8.52 / 11.52) vs the 30.0 tok/s plain Vulkan baseline
    — 3.2x slower — and draft acceptance collapses to 10-19% vs the 73-90% the
    community measured on the same fork built with ROCm/HIP. The DFlash diffusion
    draft''s block predictions do not align with the target model on the RADV/Vulkan
    path. NOT added to docker-compose.yml: nothing here is worth serving. This
    closes M-050''s speculative-decoding investigation with all three options now
    resolved (1: this negative; 2: XS too heavy a classic draft; 3: DFlash checkpoint
    unsupported by stock llama.cpp). Recommend continuing to serve Laguna-S-2.1
    plain (30.0 tok/s, full 131072 context).'
  notes: 'Custom image `local-ai-machine/llamacpp-laguna-fork:vulkan-radv` built
    from `docker/llamacpp-laguna-fork-vulkan-radv.dockerfile` (kyuz0 toolbox base,
    which carries the Vulkan dev toolchain + Mesa RADV 25.3.6 runtime). Fork head
    04b2b72cb54048ead292884adbe11f284e3ec950. Build fixes required (see engine
    recipe known_gotchas): dangling `ld` alternative in the toolbox image, and GCC 15
    missing `<cmath>` include in common/speculative.cpp''s DFlash row-clamping path.

    Loaded at the FULL -c 131072 context (unlike the classic-XS sibling build, which
    OOM''d past 8192) — the tiny 2GB DFlash draft plus its KV cache fits alongside the
    68GB target, so the context handicap that dogged the XS comparison does NOT apply
    here. This is a clean apples-to-apples run at the same context as the 30.0 tok/s
    plain baseline.

    Real benchmark (see benchmark_runs): 3 short fresh prompts + 1 long-context
    prompt (11,243 prompt tokens), measured via /v1/chat/completions request timings
    (llama-bench has no --spec-type support, same caveat as the XS/MTP-family
    builds). `--spec-type draft-dflash --spec-draft-n-max 15` confirmed active via
    draft_n/draft_n_accepted telemetry (draft_n ~2000-3000 per 512-token generation
    — roughly 5-6 drafted tokens per generated token, consistent with block-diffusion
    drafting at n_max 15). Short-context generation 7.98 / 8.52 / 11.52 tok/s (avg
    9.34), long-context 7.92 tok/s. Draft acceptance 10.4% / 12.0% / 18.6% short,
    11.4% long. Contrast with the same fork on ROCm/HIP (community thread, M-050):
    acceptance 73.5-90.6% but real speed only ~19-26 tok/s (ROCm base was slower).
    Here the Vulkan target is fast but the DFlash draft path is broken-in-effect —
    the opposite failure mode, both net negatives. No crash, no clean "doesn''t
    build" — just a decisive throughput regression, which is the honest result the
    card anticipated as a possible outcome ("record honestly either way").

    No workaround was pursued past this point, per the card''s explicit instruction
    not to debug someone else''s unmerged fork indefinitely. Host restored to
    pre-task state: standing laguna-s-2.1-118b-q4km compose service back up and
    healthy, ds4 imatrix download (M-051) resumed to activating, no stray containers,
    box repo worktree clean.

    '
