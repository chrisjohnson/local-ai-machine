notes: >
  First real serve/benchmark of this model in any form on this machine,
  2026-07-24, run immediately after GPT-OSS-120B in the same session
  (standard stack down the whole time between the two, not restored in
  between). Speed numbers look completely normal/competitive for a
  small-active-param MoE model — no sign of the 120B tier's per-token
  slowdown despite identical MXFP4 format and parser stack, reinforcing
  that the 120B slowdown is param-count/expert-pool-driven, not a blanket
  MXFP4-on-this-hardware penalty. Six-tier harness 10/12 — solid but not
  top-tier; strong speed and best-in-class concurrency headroom make it a
  judge-role candidate. Same --backend openai --endpoint /v1/completions
  methodology deviation as GPT-OSS-120B required (harmony format).
