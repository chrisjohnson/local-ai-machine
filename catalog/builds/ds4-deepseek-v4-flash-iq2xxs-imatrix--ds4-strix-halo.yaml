  notes: 'M-051: re-run of the M-047 MTP-on/off benchmark on the CORRECT GGUF variant. The prior entry
    (`catalog/builds/ds4-deepseek-v4-flash-iq2xxs--ds4-strix-halo.yaml`) ran on the plain, non-imatrix
    file per the repo''s general README guidance; the Strix-Halo-specific upstream doc
    (github.com/antirez/ds4/blob/main/STRIXHALO.md, section 5, "Use the right GGUF") explicitly
    recommends the `-imatrix.gguf` variant instead. This entry uses that correct file
    (`DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix.gguf`, confirmed present on
    disk at 86,720,111,488 bytes, matching the configuration.nix-declared size exactly).

    Same engine/deployment pattern as M-047: served via `kyuz0/strix-halo-ds4-toolbox:rocm-7.14` (ad hoc
    `docker run`, no standing compose service; image was already cached on the host from the prior
    benchmark), same flags (`--rocm -c 128000 --prefill-chunk 1024`), same real ~116k-token prompt file
    reused byte-for-byte from the M-047 run (`/tmp/ds4-bench/long_prompt_120k.txt` on the host, 115,837
    prompt tokens per both runs'' own usage blocks), same `ds4_stream_bench.py` streaming-timing script
    (also reused from the M-047 run, unmodified) for an apples-to-apples methodology match. Both runs
    (no-MTP and MTP) executed back-to-back in a clean single-model host state (all other model-serving
    containers explicitly stopped by name beforehand, confirmed via `docker ps` and `free -h`).

    **Result: confirms M-047''s finding on the correct file -- MTP washes, does not help, on this
    hardware for this model.** No-MTP: prefill 137.80 tok/s avg (841.18s wall for the 115,837-token
    prompt + 300-token completion), generation 11.81 tok/s avg (300 tokens in ~25.4s per the server''s
    own per-chunk decode log). MTP-enabled: prefill 99.25 tok/s avg (1167.10s prefill alone, 1192.51s
    total) -- again notably slower prefill than the no-MTP run despite MTP not algorithmically touching
    prefill (same effect M-047 observed and attributed, not confirmed further, to the draft model''s
    resident weights competing for memory bandwidth even during prefill); generation 11.85 tok/s avg
    (25.33s for 300 tokens) -- statistically indistinguishable from the no-MTP run''s 11.81 tok/s (0.04
    tok/s apart, within run-to-run noise, not a real difference).

    These numbers are remarkably close to M-047''s original wrong-variant numbers (no-MTP: 141.41/11.86
    tok/s vs this run''s 137.80/11.81; MTP: 99.26/11.86 tok/s vs this run''s 99.25/11.85) -- the imatrix
    calibration measurably changes quantization *quality* (perplexity/output correctness), not raw
    decode/prefill throughput, which tracks file size and architecture, both unchanged between variants
    (both files are ~86.72GB). This is the expected outcome, not a surprise: imatrix calibration guides
    *which* quantization levels get assigned to which weights within the same target bit-width, it does
    not change the bit-width or tensor layout, so the compute cost per token is unaffected. What this
    re-run resolves is the correctness gap M-047 flagged (wrong file, unverified output quality), not the
    speed number, which was already a reasonable estimate.

    No OOM encountered this run (`--prefill-chunk 1024` from M-047''s own fix applied from the start,
    not rediscovered). Both `docker run` containers (`ds4-imatrix-nomtp`, `ds4-imatrix-mtp`) were ad hoc,
    stopped and removed immediately after each run; host returned to a clean idle state between and after
    (confirmed via `free -h`, ~4.6GiB baseline).

    Old wrong-variant local directory (`ds4-deepseek-v4-flash-iq2xxs`, ~84GB) deliberately left in place,
    per M-051''s own plan item 4 -- a separate, deliberate deletion decision left for Chris, not an
    automatic side effect of this benchmark.
    '
