  notes: 'Standalone DwarfStar (ds4) engine, NOT llama.cpp -- antirez/ds4, purpose-built inference
    engine for DeepSeek V4 Flash with a dedicated Strix Halo ROCm build target. Served via
    `kyuz0/strix-halo-ds4-toolbox:rocm-7.14` (same trusted author as this box''s existing vLLM/llama.cpp
    toolbox images). No docker-compose service exists for this -- deployed via ad hoc `docker run`
    (containers `ds4-128k-*`) for this benchmark, matching the "swap-in comparison tier" pattern used
    elsewhere in this catalog for non-standing builds.

    **Known gap, not yet corrected: this benchmark ran on the WRONG GGUF variant.** The Strix-Halo-specific
    upstream doc (github.com/antirez/ds4/blob/main/STRIXHALO.md) explicitly recommends the
    `-imatrix.gguf` variant ("Use the standard IQ2XXS/Q2K/Q8 imatrix GGUF:
    DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix.gguf"). This build downloaded
    and benchmarked the plain, non-imatrix file (`...-chat-v2.gguf`, no `-imatrix` suffix) per the
    repo''s general (non-hardware-specific) README guidance instead. Both files are ~86.72GB (imatrix
    calibration affects quantization quality, not size), so this is a correctness gap, not a capacity
    one. The MTP-vs-no-MTP *comparison* below is still internally fair (both runs used the same wrong
    file), but the absolute tok/s numbers may not match what the recommended imatrix variant would give.
    Follow-up: download `...-chat-v2-imatrix.gguf` and re-run both benchmarks for authoritative numbers.

    A real, hardware-specific OOM was hit and fixed during this benchmark, not worked around blindly:
    `ds4-server` at `--ctx 128000` was OOM-killed by the kernel during prefill of a real ~116k-token
    prompt (confirmed via `journalctl -k`). Root cause matches a known, still-unmerged upstream issue
    (antirez/ds4 issue #359, PR #361): the ROCm backend''s tensor allocator uses device-only `cudaMalloc`
    instead of `cudaMallocManaged`, so prefill scratch buffers can''t spill into the broader unified-memory
    pool even though `amdgpu.gttsize=126976` is already correctly configured on this box. Fixed with
    `--prefill-chunk 1024` (below the tool''s own default of 4096), which keeps peak allocation small
    enough to avoid the OOM -- a legitimate documented flag, not a hack.

    **Real result: MTP made no measurable difference to generation speed on this hardware.** Both runs
    used the identical real ~116k-token prompt (115,837 prompt tokens) + 300-token generation, same
    container image, same host state:
    - No MTP: prefill 141.41 tok/s avg (819.14s for 115,837 tokens), generation 11.86 tok/s avg (25.29s
      for 300 tokens), no OOM.
    - MTP enabled: prefill 99.26 tok/s avg (1167.05s for 115,837 tokens) -- notably slower prefill despite
      MTP not algorithmically affecting prefill; likely the MTP draft model''s resident weights competing
      for memory bandwidth even during prefill, not confirmed further. Generation: 11.86 tok/s avg
      (25.29s for 300 tokens) -- statistically identical to the no-MTP run, not a rounding coincidence
      (matched to 2 decimal places across the whole decode span).
    - This matches independent research found the same session: a different quantizer''s README for
      this same base model reported "MTP was a net loss of 3-11%" on Apple Silicon, attributing it to
      being compute/dequantization-bound rather than memory-bandwidth-bound -- here it is not quite a
      loss, but a complete wash. Consistent with the theory that at this quantization level, dequantization
      cost dominates decode regardless of platform, so speculative verification work is not free and
      does not pay for itself.

    Real generation speed (11.86 tok/s either way) is modest for a 13B-active model on this hardware --
    notably slower than every 3B-10B-active model already benchmarked in this catalog. Given the known
    wrong-variant gap above, this number should be treated as provisional pending a re-run on the
    recommended imatrix build, not a final verdict on this engine/model combination for this hardware.
    '
