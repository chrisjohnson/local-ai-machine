  notes: 'gbuzhf MTP graft, 30,012,294,784 bytes (~28.0 GiB) confirmed via HF API tree listing.
    Q6_K is the top quant available (no Q8 MTP build exists). Imatrix calibrated on KAT''s own
    output, but no imatrix stats cover blk.40 (the MTP head never executes during calibration —
    quantized unguided, a shared limitation of both graft repos). Per gbuzhf''s measured notes MTP
    ALONE is a net loss on this arch — must run --spec-type draft-mtp,ngram-mod together (the
    compose service carries the full coordinate-ascent flag set; llama.cpp build 10154 defaults
    n-min 48/n-max 64/n-match 24, explicit flags required, not cosmetic). -np 1 required for MTP.

    First benchmark 2026-08-05 (M-083), download queue paused and all model services stopped.
    Plain-decode llama-bench baseline: pp512 976.57±9.92 tok/s, tg128 58.25±0.27 tok/s. MTP live
    server timing (draft-mtp+ngram-mod flag set, MTP context creation confirmed in logs): 62.28-
    63.11 tok/s avg 62.75 (4th sample 69.01) → ~1.08x speedup over plain tg128. Note: gbuzhf''s own
    numbers were RTX 3070 Ti laptop with 35/40 layers on CPU — real Strix-Halo numbers now
    measured, and the MTP gain on this hardware is modest (~8%), well short of the 1.8-2.5x range
    some community references cite for other models. Peak unified-memory (GTT) footprint during
    llama-bench: 28,419 MiB (~27.8 GiB); steady-state llama-server resident 29.1 GB (~27.1 GiB)
    GTT with 33 GiB system used.

    '
