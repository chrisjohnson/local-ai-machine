  notes: 'Not yet run on this machine. poolside/Laguna-S-2.1, released ~2026-07-21 — 118B total / ~8B
    active MoE. Real model, confirmed via HF and a merged llama.cpp PR (not a research gap at add-time
    — this entry is purely the add-and-download step). Repo/files verified real and exact via the HF API
    tree listing (unsloth/Laguna-S-2.1-GGUF): UD-Q4_K_M/ contains exactly 3 shards, real total 73,119,183,552
    bytes (~68.10 GiB / ~73.12 GB) — matches the ~73.1GB prior research figure. Repo also hosts 15 other
    quant/format variants (BF16, MXFP4_MOE, Q8_0, UD-IQ1_S through UD-Q8_K_XL) side by side in the same
    tree; hfFiles allowlist in configuration.nix pulls only the UD-Q4_K_M shards.

    Two real, distinct known issues from the upstream PR thread — both worth tracking separately, neither
    is a reason to skip this build:

    1. llama.cpp architecture support for this model only merged upstream ~2026-07-22 (ggml-org/llama.cpp
    PR #25165) — very fresh, minimal real-world exercise elsewhere yet.

    2. A confirmed RDNA3.5 crash exists for this architecture, but per the PR thread it''s specific to
    the HIP/ROCm backend. This box''s llama.cpp build only ever runs Vulkan RADV (never ROCm/HIP) for
    the llamacpp-vulkan-radv-v1 engine, so the crash likely doesn''t apply here — but that has NOT been
    independently confirmed working on Vulkan by anyone yet. For this reason Chris wants a supervised/attended
    single-prompt smoke test (watching the console directly) before this build gets folded into the unattended
    benchmark sweep — do not run it unsupervised.

    3. Separately, and backend-independent (applies regardless of Vulkan vs ROCm): the same PR thread
    documents a real reasoning/EOS-token bug that can cause runaway/erratic generation. The attended smoke
    test should be run with `--reasoning off` or a hard max-tokens cap as a precaution, and this build''s
    eventual real benchmark run should carry that same flag if the model proves viable.

    ATTENDED SMOKE TEST PASSED (2026-07-29): ran via manual `docker run` (llama-server, `-ngl 999 -fa
    1 --swa-full --reasoning-format none -n 512 -c 16384`), watched the console directly per Chris''s
    requirement. Load: clean, ~81s for 69GB, no crash, no HIP-style error (confirms the RDNA3.5/HIP-specific
    crash from the PR thread does not apply to this box''s Vulkan RADV engine). The documented `special_eos_id
    is not in special_eog_ids` tokenizer warning DID appear at load time, confirming the backend-independent
    reasoning/EOS bug is real for this build too — `--reasoning-format none` did NOT suppress `<think>`
    tag generation in the actual response content (that flag appears to control API response parsing/formatting,
    not generation itself) — the hard `-n` token cap is the mechanism that actually bounds runaway generation,
    not the reasoning-format flag; carry the `-n` cap (or an equivalent stop condition) into any real
    benchmark run of this build, don''t rely on `--reasoning-format` alone. Sent one real coding prompt
    (longest palindromic substring): coherent, technically correct reasoning (identified brute-force O(n^3),
    Manacher''s algorithm, and settled on expand-around-center O(n^2) with correct odd/even-length handling),
    hit the 512-token cap mid-explanation before emitting actual code — reflects a verbose reasoning style,
    not a failure; real benchmark runs of this build will need a larger token budget to reach final answers.
    Real measured speed: 30.0 tok/s generation, 80.4 tok/s prompt processing — notably faster than the
    community reference video''s 12 tok/s (that setup used `--n-cpu-moe` to offload experts to system
    RAM on a VRAM-constrained discrete GPU; this box''s unified memory needs no such offload, confirmed
    via `-ngl 999` placing everything on-GPU without issue). Standing vLLM services were stopped before
    the test and restored after, per the mandatory GPU-contention procedure.

    REAL BENCHMARK COMPLETED (2026-08-01), superseding the attended-smoke-test-only status above.
    The 30.0 tok/s figure quoted throughout this session (including in the M-050 speculative-decoding
    comparison cards) was, until now, a single generation-speed number from that 2026-07-29 attended
    smoke test (a single 512-token coding prompt, `--reasoning-format none`, no long-context sample, no
    recorded `benchmark_runs[]` fingerprint) — real, but thin. This run adds a proper fingerprinted
    multi-sample benchmark: started via the real `docker-compose.yml` service
    (laguna-s-2.1-118b-q4km--llamacpp-vulkan-radv-v1, port 8101, exact recorded flags: `-ngl 999 -fa 1
    --swa-full --reasoning-format deepseek -n 8192 -c 131072`), no ad-hoc flags. 3 short-context samples
    (a coding prompt, a networking-explanation prompt, a list-facts prompt, each capped at max_tokens=400,
    each naturally continuing into `reasoning_content` per the deepseek reasoning format, consistent with
    the smoke test''s finding that this model reasons verbosely) plus 1 long-context sample (a real
    12,057-token summarization prompt, fresh/non-cached, which completed naturally via a `stop` finish
    reason with a coherent, correct 3-bullet summary rather than hitting a token cap). Result: generation
    speed 30.91-30.96 tok/s across the three short-context samples (essentially flat, confirming the
    30.0 tok/s figure was accurate, if anything very slightly conservative) and 27.42 tok/s at the
    12,057-token long-context sample (prompt processing 312.6 tok/s at that same long context). No
    reasoning/EOS runaway-generation issue was observed in this run (all 4 requests terminated normally,
    3 via max_tokens as expected given the verbose reasoning style, 1 via natural stop). Standing model
    services were already stopped at benchmark start (host had no llama.cpp/vLLM containers running);
    this compose service was started, benchmarked, then stopped and removed, restoring the host to its
    pre-benchmark state.

    '
