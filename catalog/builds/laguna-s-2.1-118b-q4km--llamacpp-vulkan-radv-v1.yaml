notes: >
  Not yet run on this machine. poolside/Laguna-S-2.1, released ~2026-07-21 —
  118B total / ~8B active MoE. Real model, confirmed via HF and a merged
  llama.cpp PR (not a research gap at add-time — this entry is purely the
  add-and-download step). Repo/files verified real and exact via the HF API
  tree listing (unsloth/Laguna-S-2.1-GGUF): UD-Q4_K_M/ contains exactly 3
  shards, real total 73,119,183,552 bytes (~68.10 GiB / ~73.12 GB) — matches
  the ~73.1GB prior research figure. Repo also hosts 15 other quant/format
  variants (BF16, MXFP4_MOE, Q8_0, UD-IQ1_S through UD-Q8_K_XL) side by side
  in the same tree; hfFiles allowlist in configuration.nix pulls only the
  UD-Q4_K_M shards.

  Two real, distinct known issues from the upstream PR thread — both worth
  tracking separately, neither is a reason to skip this build:

  1. llama.cpp architecture support for this model only merged upstream
  ~2026-07-22 (ggml-org/llama.cpp PR #25165) — very fresh, minimal real-world
  exercise elsewhere yet.

  2. A confirmed RDNA3.5 crash exists for this architecture, but per the PR
  thread it's specific to the HIP/ROCm backend. This box's llama.cpp build
  only ever runs Vulkan RADV (never ROCm/HIP) for the llamacpp-vulkan-radv-v1
  engine, so the crash likely doesn't apply here — but that has NOT been
  independently confirmed working on Vulkan by anyone yet. For this reason
  Chris wants a supervised/attended single-prompt smoke test (watching the
  console directly) before this build gets folded into the unattended
  benchmark sweep — do not run it unsupervised.

  3. Separately, and backend-independent (applies regardless of Vulkan vs
  ROCm): the same PR thread documents a real reasoning/EOS-token bug that can
  cause runaway/erratic generation. The attended smoke test should be run
  with `--reasoning off` or a hard max-tokens cap as a precaution, and this
  build's eventual real benchmark run should carry that same flag if the
  model proves viable.

  ATTENDED SMOKE TEST PASSED (2026-07-29): ran via manual `docker run`
  (llama-server, `-ngl 999 -fa 1 --swa-full --reasoning-format none -n 512
  -c 16384`), watched the console directly per Chris's requirement. Load:
  clean, ~81s for 69GB, no crash, no HIP-style error (confirms the
  RDNA3.5/HIP-specific crash from the PR thread does not apply to this
  box's Vulkan RADV engine). The documented `special_eos_id is not in
  special_eog_ids` tokenizer warning DID appear at load time, confirming
  the backend-independent reasoning/EOS bug is real for this build too —
  `--reasoning-format none` did NOT suppress `<think>` tag generation in
  the actual response content (that flag appears to control API response
  parsing/formatting, not generation itself) — the hard `-n` token cap is
  the mechanism that actually bounds runaway generation, not the
  reasoning-format flag; carry the `-n` cap (or an equivalent stop
  condition) into any real benchmark run of this build, don't rely on
  `--reasoning-format` alone. Sent one real coding prompt (longest
  palindromic substring): coherent, technically correct reasoning
  (identified brute-force O(n^3), Manacher's algorithm, and settled on
  expand-around-center O(n^2) with correct odd/even-length handling),
  hit the 512-token cap mid-explanation before emitting actual code —
  reflects a verbose reasoning style, not a failure; real benchmark runs
  of this build will need a larger token budget to reach final answers.
  Real measured speed: 30.0 tok/s generation, 80.4 tok/s prompt
  processing — notably faster than the community reference video's 12
  tok/s (that setup used `--n-cpu-moe` to offload experts to system RAM
  on a VRAM-constrained discrete GPU; this box's unified memory needs no
  such offload, confirmed via `-ngl 999` placing everything on-GPU
  without issue). Standing vLLM services were stopped before the test and
  restored after, per the mandatory GPU-contention procedure.
