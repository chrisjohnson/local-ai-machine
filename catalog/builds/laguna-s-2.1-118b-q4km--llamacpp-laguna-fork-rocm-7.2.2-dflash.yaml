  role: 'M-086 ROCm retry — a NEW image (NOT a rebuild of M-055''s rocm-7.14,
    which never got DFlash serving on this box: the server hung at ~551MiB RSS
    with no output for 7+ minutes, and even a plain no-draft load stalled).
    M-086''s fresh web research (2026-08-06) found M-055''s build was missing
    chip-specific fixes documented by two independent community sources for
    gfx1151: wrong ROCm version (7.14 vs the validated 7.2.0-7.2.3 range),
    missing GGML_HIP_ROCWMMA_FATTN/GGML_HIP_NO_VMM/GGML_HIP_MMQ_MFMA build
    flags, and missing `-dio`/`--no-mmap`+cgroup-budget runtime flags for the
    exact "KFD driver thrash" hang M-055 hit. Result: TESTED_NOT_VIABLE, but a
    MATERIALLY DIFFERENT (and more informative) negative than M-055''s. The
    server now LOADS AND SERVES SUCCESSFULLY — first time DFlash-on-ROCm has
    ever worked on this box, confirming the M-055 build really was missing
    fixable issues, not hitting a fundamental hardware incompatibility. BUT
    once serving, the community''s claimed 73.5-90.6% draft acceptance does
    NOT reproduce: 11.0-13.0% at n_max=15 (the community''s own tested
    config), rising to 31-52% at smaller block sizes — closely tracking the
    SAME block-size-acceptance curve already seen on Vulkan (M-055), not a
    step-change improvement. Raw decode throughput on ROCm also trails Vulkan
    at every block size (best ROCm sample 25.57 tok/s at n3, vs Vulkan
    BF16-draft 30.9 tok/s and Vulkan Q4_K_M-draft 34.77 tok/s at the same
    n-range) — ROCm''s base per-token compute/memory-bandwidth path on this
    chip is simply slower than RADV/Vulkan''s here, on top of not fixing the
    acceptance problem. NOT added to docker-compose.yml: no ROCm DFlash
    config approaches, let alone beats, the 30.0 tok/s plain baseline, and no
    prior DFlash experiment on this box has ever gotten a standing compose
    service (ad-hoc `docker run` only, by design). Net verdict: the
    community''s ROCm acceptance advantage was real for THEIR environment/
    patch level, but is not reproducible on this box''s ROCm/HIP stack even
    with the documented gfx1151-specific fixes applied — the earlier M-055
    "dead end" conclusion for ROCm holds, just for a different, better-
    understood reason (base throughput + unreproduced acceptance, not a
    load-time hang).'
  notes: 'Custom image `local-ai-machine/llamacpp-laguna-fork:rocm-7.2.2` built
    from `docker/llamacpp-laguna-fork-rocm-7.2.2.dockerfile` (base
    rocm/dev-ubuntu-24.04:7.2.2-complete). Fork pinned to the IDENTICAL commit as
    the Vulkan build and M-055''s rocm-7.14 (04b2b72) for a clean A/B. Build flags:
    GGML_HIP=ON, AMDGPU_TARGETS=gfx1151, GGML_HIP_ROCWMMA_FATTN=ON (+ rocwmma-dev
    apt package), GGML_HIP_NO_VMM=ON, GGML_HIP_MMQ_MFMA=ON. Build took ~3 min
    compile time once the 7.37GB base image was pulled (throttled ~7-8MB/s on this
    box''s link, ~17 min for the pull alone — consistent with M-055''s own note
    about throttled bandwidth). llama-quantize also built as a bonus target (not
    used in this experiment).

    gfx1151 detected NATIVELY (`llama-cli --list-devices` -> "ROCm0: Radeon 8060S
    Graphics (126976 MiB, 14857 MiB free)"), no HSA_OVERRIDE_GFX_VERSION needed.

    Runtime: `--memory=110g` cgroup budget, `--no-mmap`, `-dio`, `-fa 1` (works here
    thanks to ROCWMMA_FATTN — M-055 assumed FA was fundamentally broken on
    gfx1151/ROCm and ran -fa 0, but per the community docs that was a missing-
    package problem, not a hardware limit; this build never needed to fall back to
    -fa 0). Load reached "model loaded, listening" at n_max=15/-fa 1/-c 131072 in
    ~65-70s cold (~55s warm with page cache from a prior run) — memory climbed
    smoothly from ~73GiB to ~104GiB used with no stall/thrash pattern, in sharp
    contrast to M-055''s hang (~551MiB RSS, no progress for 7+ minutes, SIGTERM-
    immune). The exact fix responsible is not isolated (the combination of new
    ROCm version + all four build flags + all three runtime flags was tested as a
    bundle per the card''s scope — no time-boxed bisection of which single change
    mattered), but the load problem is resolved either way.

    Sweep: n_max in {15, 4, 3, 2}, 2 short fresh prompts per config, full -c 131072
    context, -fa 1, MAX_TOKENS=256 (matches the Vulkan quantized-draft sweep
    methodology in this same card). Raw responses at
    catalog/raw/laguna-rocm-7.2.2-2026-08-06/<n_max>/short-0.json,short-1.json.

    Full sweep table:

      | n_max | tok/s range   | acceptance range | vs Vulkan BF16-draft (M-055, same n_max) |
      |-------|---------------|-------------------|--------------------------------------------|
      | 15    | 13.92-15.83   | 11.0-13.0%        | 7.9-11.5 tok/s, 10-19% (ROCm faster raw tok/s at n15, similar acceptance) |
      | 4     | 20.90-21.42   | 31.3-32.0%        | 24.8-27.1 tok/s, 31-38% (Vulkan faster, similar acceptance) |
      | 3     | 22.78-25.57   | 40.3-49.5%        | 27.1-30.9 tok/s, 39-49% (Vulkan faster, near-identical acceptance) |
      | 2     | 22.65-23.42   | 48.6-52.4%        | 27.7-30.1 tok/s, 48-55% (Vulkan faster, near-identical acceptance) |

    Findings: (a) acceptance-vs-block-size curve on ROCm is essentially the SAME
    shape as Vulkan''s (both rise from ~11-19% at n15 to ~48-55% at n2) — this is
    strong evidence the block-size acceptance effect is a property of the
    DFlash architecture/decoding algorithm itself, not a backend-precision
    artifact, and definitively answers M-055''s open question ("is the
    community''s ROCm acceptance advantage backend-specific?") with NO, it is
    not reproducible here regardless of backend. (b) ROCm''s raw decode
    throughput trails Vulkan/RADV at every block size on this box — the reverse
    of the community''s report (lower ROCm base speed but MUCH higher
    acceptance); here ROCm gets neither advantage. (c) this closes the
    ROCm-vs-Vulkan backend-attribution question definitively: neither backend
    reproduces the community''s numbers, and Vulkan (with a quantized draft,
    the OTHER M-086 experiment) is the only config across the whole
    M-050/M-053/M-055/M-086 investigation to beat the 30.0 tok/s baseline.

    Host restored to pre-task state after the full sweep: standing
    laguna-s-2.1-118b-q4km-v2 and qwen3.6-35b-a3b-mtp-v2 compose services back up
    and healthy (confirmed via /health on their actual ports 8108/8109), no
    leftover laguna-rocm-test container, no downloads left paused, box repo clean.
    Old M-055 ROCm 7.14 images (local-ai-machine/llamacpp-laguna-fork:rocm-7.14,
    rocm/dev-ubuntu-24.04:7.14.0-full) removed before this build to free disk
    headroom (box was at 94% / 113G free) — that build reached a decisive
    conclusion already and a fresh image was required by this card''s own scope.'
