notes: >
  81.3 tok/s prompt processing, 70.1 tok/s generation (256-token generation,
  single prompt) — ~3.7x faster generation than the same model's vLLM+AWQ
  numbers (18.95/30.19 c1/c8). Caveat: not a pure backend-only ablation since
  the quantization format also differs (Q4_K_M GGUF vs AWQ 4-bit) — some of
  the gap could be quant-format-driven, not purely backend-driven. This
  exact file also exposed the Ollama gemma4-unrelated ROCm-crash bug (see
  the ollama-rocm-0177-broken engine) — loaded and generated successfully
  here on the first try, proving that crash was Ollama/ROCm-specific.
