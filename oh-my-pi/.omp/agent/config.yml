# omp settings — model role routing (config.yml, read at ~/.omp/agent/config.yml).
#
# Maps every built-in omp modelRole to one of our two litellm-backed local roles:
#   local-litellm/medium-moe -> qwen3.6-35b-a3b MoE, 35B/3B-active — fast, chat-completes ~0.6s
#   local-litellm/big-moe    -> laguna-s-2.1-118b-q4km, 118B MoE   — deep reasoning
# (see docker/litellm/config.yaml for current backend ports)
#
# role->target split rationale:
#   default / smol / commit / tiny / task / vision -> medium-moe (fast interactive + fan-out)
#   slow / plan / designer / advisor               -> big-moe    (heavy reasoning, planning)
# A role pointing at another role is also legal (e.g. slow: @plan) but we bind directly
# to the provider/model id so the mapping survives settings churn. Thinking-level suffixes
# (:minimal..:xhigh) are unsupported by llama.cpp serving — omit them.
modelRoles:
  default: local-litellm/medium-moe
  smol: local-litellm/medium-moe
  slow: local-litellm/big-moe
  vision: local-litellm/medium-moe
  plan: local-litellm/big-moe
  designer: local-litellm/big-moe
  commit: local-litellm/medium-moe
  tiny: local-litellm/medium-moe
  task: local-litellm/medium-moe
  advisor: local-litellm/big-moe
