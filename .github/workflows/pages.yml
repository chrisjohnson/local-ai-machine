name: Publish docs to GitHub Pages

# Publishes docs/ (the pi-web-factory walkthrough, benchmark reports, comparison
# dashboards — all static HTML checked into the repo already) to the gh-pages
# branch on every push to main that touches docs/. Deliberately no third-party
# Actions here — this repo just went public, and the only real supply-chain
# surface for a "copy some files and push a branch" job is git itself.
#
# GitHub Pages itself is configured (repo Settings > Pages) to serve from the
# gh-pages branch, root directory — a one-time manual setting, not something a
# workflow run can flip on its own via the REST API without extra permissions
# this job doesn't otherwise need.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate docs/index.html (lists every .html doc)
        run: |
          cd docs
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>local-ai-machine — docs</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;color:#15131b;background:#f7f1e6}'
            echo 'h1{font-size:20px}ul{padding-left:20px}li{margin:8px 0}a{color:#6430d8}'
            echo '@media (prefers-color-scheme:dark){body{color:#f7f4ff;background:#070912}a{color:#b7a2ff}}</style></head><body>'
            echo '<h1>local-ai-machine — docs</h1><ul>'
            for f in $(find . -maxdepth 1 -iname '*.html' ! -name 'index.html' | sed 's|^\./||' | sort -r); do
              echo "<li><a href=\"$f\">$f</a></li>"
            done
            echo '</ul></body></html>'
          } > index.html

      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/gh-pages gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/gh-pages
          fi

          rm -rf /tmp/gh-pages/*
          cp -r docs/. /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll

          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "Publish docs from ${GITHUB_SHA}"
            git push origin gh-pages
          fi
