<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>pi-agent</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Session list view -->
    <section id="view-list" class="view">
      <header class="topbar">
        <h1>pi-agent</h1>
        <button id="new-session-btn" class="btn primary">+ New session</button>
      </header>
      <ul id="session-list" class="session-list"></ul>
      <p id="list-empty" class="empty hidden">No sessions yet. Create one to get started.</p>
    </section>

    <!-- Session detail / chat view -->
    <section id="view-session" class="view hidden">
      <header class="topbar">
        <button id="back-btn" class="btn icon" aria-label="Back to sessions">&larr;</button>
        <div class="session-title">
          <h1 id="session-label">session</h1>
          <span id="session-status" class="status-pill">idle</span>
        </div>
      </header>
      <div id="transcript" class="transcript"></div>
      <form id="composer" class="composer">
        <textarea id="message-input" placeholder="Message the agent..." rows="1"></textarea>
        <button type="submit" class="btn primary" id="send-btn">Send</button>
      </form>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
