# litellm-queue-haproxy (M-094): replaces the custom Bun reverse proxy
# (docker/litellm-queue-proxy/, kept as-is for reference/history — its own
# card decision log documents a real bug it had: a request could hang
# indefinitely with no timeout-based fallback release, and it blocked its
# own health endpoint while stuck). HAProxy has been solving exactly this
# class of problem — hold excess concurrent requests to a backend in a
# queue rather than reject or hang — for over two decades; using it instead
# of patching the bespoke implementation further.
#
# Same topology as the Bun version: listens on :4001, forwards every
# request transparently to litellm on :4000, `maxconn 1` on the single
# backend server gives global (not per-model) concurrency serialization —
# every request goes through litellm as ONE upstream regardless of which
# model it targets, so limiting concurrency to litellm itself achieves
# cross-model serialization for free, the same reasoning the custom proxy
# used.
#
# No app/protocol-specific logic here on purpose (confirmed before building
# this: the custom proxy never had any either) — this is a plain transparent
# HTTP reverse proxy with a connection cap. Auth passthrough is the DEFAULT
# behavior (HAProxy forwards headers, including Authorization, untouched
# unless told otherwise) — no special config needed for that requirement.

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    # Generous timeouts: a request can legitimately wait behind another
    # model's full generation (queue) AND then need its own generation time
    # on top. 900s (15min) matches the same order of magnitude as
    # PI_WEB_FACTORY_STEP_TIMEOUT_MS (600s) with headroom above it — the
    # proxy's own timeout must not fire before the caller's, or it'd cut
    # things off prematurely and defeat the point.
    timeout connect 5s
    timeout client 900s
    timeout server 900s
    # THE safety valve the custom proxy was missing: if a request waits in
    # queue longer than this, HAProxy returns an error instead of holding
    # it forever. This is exactly the "timeout-based fallback release"
    # Phase 3 was going to require building — already built-in here.
    timeout queue 900s

frontend litellm_queue_front
    bind *:4001
    default_backend litellm_queue_back

backend litellm_queue_back
    # maxconn 1: the actual semaphore. Everything else is HAProxy's own
    # battle-tested connection-queueing machinery — nothing custom.
    server litellm 127.0.0.1:4000 maxconn 1
