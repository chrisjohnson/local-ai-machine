global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Required litellm_settings.require_auth_for_metrics_endpoint: false in
  # litellm/config.yaml — this endpoint otherwise demands a Bearer token
  # Prometheus's plain static_configs scraper never sends, and it was
  # showing as permanently "down" as a result.
  - job_name: "litellm"
    static_configs:
      - targets: ["litellm:4000"]

  # Port-keyed, not container-name-keyed. This project's two-tier design
  # means the container occupying a given port changes constantly (models
  # get swapped in/out via `docker compose up -d <service>` + set-role.sh,
  # sometimes multiple times per session) — a scrape target pinned to a
  # specific container name goes stale the next time a different model
  # takes that slot. The old "vllm-primary"/"vllm-judge" targets here
  # referenced container names that no longer exist anywhere in
  # docker-compose.yml at all (leftover from an early fixed two-model
  # setup) — silently scraping nothing real for who knows how long.
  # Ports are the actually-stable identifier in this design (vLLM:
  # 8000-8099, llama.cpp-server: 8100-8199), so scrape by port instead —
  # whichever model currently occupies a given port shows up under that
  # port's target; unoccupied ports just show as a harmless "down" target.
  # host.docker.internal (see docker-compose.yml's extra_hosts on this
  # service) reaches the host's published 127.0.0.1:<port> bindings from
  # inside the prometheus container.
  - job_name: "vllm"
    static_configs:
      - targets:
          - "host.docker.internal:8000"
          - "host.docker.internal:8001"
          - "host.docker.internal:8002"
          - "host.docker.internal:8003"
          - "host.docker.internal:8004"
          - "host.docker.internal:8005"
          - "host.docker.internal:8006"
          - "host.docker.internal:8007"
          - "host.docker.internal:8008"
          - "host.docker.internal:8009"
          - "host.docker.internal:8010"
          - "host.docker.internal:8011"

  # llama.cpp-server builds — requires --metrics on each service's command
  # (disabled by default). Same port-keyed reasoning as the vllm job above.
  - job_name: "llamacpp"
    static_configs:
      - targets:
          - "host.docker.internal:8100"
          - "host.docker.internal:8101"
          - "host.docker.internal:8102"

  # Was pointed at a node-exporter container that was never actually
  # defined anywhere in the compose stack — added the real thing below
  # rather than just deleting this line, since host-level CPU/memory/disk
  # metrics are genuinely useful here (the hardware audit found real issues
  # — CPU governor, tight memory headroom — worth having on a dashboard
  # going forward, not just caught manually once).
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
