router_settings:
  routing_strategy: usage-based-routing-v2

litellm_settings:
  callbacks: ["prometheus", "jsonl_logger.JsonlFileLogger"]
  # The legacy `json` logging callback + `json_log_file_path` config key
  # were removed from litellm (crash at startup: `ValueError: Empty module
  # name`, `import_module("")`). This build's supported JSON-logging
  # switch is `json_logs: true` — emits one JSON object per log line to
  # stdout, which docker's default json-file driver persists on the box.
  # Do NOT set env LITELLM_LOG=DEBUG to chase raw bodies: with streaming
  # backends it emits a complete log line per streamed chunk (insanely
  # noisy). For one-off body capture use the per-request
  # `litellm_request_debug: true` flag instead.
  # Per-request usage + stop_reason (finish_reason) are written to
  # docker/litellm/logs/litellm.jsonl by jsonl_logger.JsonlFileLogger
  # (mounted at /app/jsonl_logger.py), one line per completed call.
  json_logs: true
  require_auth_for_metrics_endpoint: false
  # Turnstone (and likely other OpenAI-SDK clients) sends reasoning_effort
  # for its per-session "thinking effort" control, which most of this
  # project's openai-compatible model routes (vLLM/llama.cpp backends)
  # don't declare support for — litellm hard-errors on unrecognized params
  # by default rather than dropping them. Real error hit via Turnstone,
  # 2026-07-30: "UnsupportedParamsError: openai does not support
  # parameters: ['reasoning_effort']". drop_params silently discards
  # params the target model doesn't support instead of failing the
  # request outright.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Dynamic roles (coder/judge/vision) live in this DB, not in model_list
  # below - see the model_list comment block and scripts/litellm-bootstrap.sh
  # / scripts/set-role.sh for why (2026-07-31, Chris's explicit design:
  # terraform-style "codified resource, runtime value allowed to drift
  # without git ever seeing a conflict").
  store_model_in_db: true

# Virtual keys (sk-chris-master, sk-drew-edge) are generated at runtime via
# the /key/generate API against the master key, not declared here.
