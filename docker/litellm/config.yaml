# LiteLLM config — two-tier design.
#
# Model definitions live here (the catalog of what's available).
# Role selection (which model is "coder", which is "judge") is done at
# runtime via scripts/set-role.sh — no git commit or config edit needed.
#
# To switch a role:
#   docker compose up -d <service-name>
#   ./scripts/set-role.sh <role> <service-name>

model_list:
  # Dynamic roles — updated by set-role.sh, starts pointing at defaults.
  - model_name: coder
    litellm_params:
      model: openai/gemma-4-26b-a4b-it
      api_base: http://127.0.0.1:8008/v1
      api_key: "none"

  - model_name: judge
    litellm_params:
      model: openai/qwen3.5-4b-judge
      api_base: http://127.0.0.1:8001/v1
      api_key: "none"

  # Static roles — not managed by set-role.sh.
  - model_name: governed_coder
    litellm_params:
      model: openai/coder
      api_base: http://turnstone:8080/v1
      api_key: "none"

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  # All vLLM builds — fixed ports, available for set-role.sh routing.
  - model_name: qwen3.6-35b-a3b
    litellm_params:
      model: openai/qwen3.6-35b-a3b
      api_base: http://127.0.0.1:8000/v1
      api_key: "none"

  - model_name: qwen3.5-4b-judge
    litellm_params:
      model: openai/qwen3.5-4b-judge
      api_base: http://127.0.0.1:8001/v1
      api_key: "none"

  - model_name: qwen3.6-27b
    litellm_params:
      model: openai/qwen3.6-27b
      api_base: http://127.0.0.1:8002/v1
      api_key: "none"

  - model_name: glm-4.7-flash-awq
    litellm_params:
      model: openai/glm-4.7-flash-awq
      api_base: http://127.0.0.1:8003/v1
      api_key: "none"

  - model_name: qwen3-coder-next-gptq4bit
    litellm_params:
      model: openai/qwen3-coder-next-gptq4bit
      api_base: http://127.0.0.1:8004/v1
      api_key: "none"

  - model_name: gpt-oss-20b
    litellm_params:
      model: openai/gpt-oss-20b
      api_base: http://127.0.0.1:8005/v1
      api_key: "none"

  - model_name: gpt-oss-120b
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: http://127.0.0.1:8006/v1
      api_key: "none"

  - model_name: qwen3.5-122b-a10b-awq4bit
    litellm_params:
      model: openai/qwen3.5-122b-a10b-awq4bit
      api_base: http://127.0.0.1:8007/v1
      api_key: "none"

  - model_name: gemma-4-26b-a4b-it
    litellm_params:
      model: openai/gemma-4-26b-a4b-it
      api_base: http://127.0.0.1:8008/v1
      api_key: "none"

  - model_name: gemma-4-31b-it
    litellm_params:
      model: openai/gemma-4-31b-it
      api_base: http://127.0.0.1:8009/v1
      api_key: "none"

  - model_name: qwen2.5-vl-7b-instruct
    litellm_params:
      model: openai/qwen2.5-vl-7b-instruct
      api_base: http://127.0.0.1:8010/v1
      api_key: "none"

  - model_name: north-mini-code-1.0
    litellm_params:
      model: openai/north-mini-code-1.0
      api_base: http://127.0.0.1:8011/v1
      api_key: "none"

  # llama.cpp-server builds — fixed ports, set-role.sh-compatible (reads
  # -a/--alias for the model name, same as it reads --served-model-name
  # for vLLM builds).
  - model_name: laguna-s-2.1-118b-q4km
    litellm_params:
      model: openai/laguna-s-2.1-118b-q4km
      api_base: http://127.0.0.1:8101/v1
      api_key: "none"

router_settings:
  routing_strategy: usage-based-routing-v2

litellm_settings:
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# Virtual keys (sk-chris-master, sk-drew-edge) are generated at runtime via
# the /key/generate API against the master key, not declared here.
