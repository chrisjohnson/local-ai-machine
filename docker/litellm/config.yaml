# LiteLLM config — two-tier design.
#
# Model definitions live here (the catalog of what's available).
#
# Dynamic roles (big-moe/medium-moe/medium-dense/small-moe/small-dense —
# named by model size + architecture, e.g. "which model currently answers
# as big-moe" — NOT by function; see 2026-08-03 rename below) are
# DELIBERATELY NOT in model_list below. They live entirely in litellm's
# own database (store_model_in_db: true, see general_settings), managed
# via the Model Management API
# (https://docs.litellm.ai/docs/proxy/model_management), not this file.
#
# Naming (2026-08-03): roles were renamed from function-based names
# (coder/judge/vision/orchestrator/planner) to size+architecture-based
# names (big-moe/medium-moe/medium-dense/small-moe/small-dense) — all
# lowercase, hyphens only. judge and orchestrator, which had already
# collapsed onto the same physical backend, collapsed into the single
# role small-moe. See scripts/litellm-bootstrap.sh's ROLES array for the
# full current list.
#
# This is a deliberate design (2026-07-31, Chris's explicit direction,
# terraform's `lifecycle { ignore_changes }` as the reference model): git
# codifies that a role named "coder" should exist, with some startup
# stub value — but the ACTUAL live value is allowed to drift on the
# running server without ever showing up as a git conflict, because git
# never tracks it in the first place. The previous design (role VALUES
# committed here, edited by scripts/set-role.sh via sed) caused a real
# git pull conflict the first time a new role (vision) needed both a new
# committed block AND a live runtime flip in the same file/session.
#
# - scripts/litellm-bootstrap.sh seeds each role's DB entry ONCE, with an
#   OBVIOUSLY non-functional stub (model: openai/UNCONFIGURED-run-set-role.sh,
#   api_base: http://unconfigured.invalid/v1) if it doesn't already exist.
#   That stub is NOT a description of any real model — it exists only so
#   the role name is present at all before the first real set-role.sh
#   call. A future reader should never assume this file (or the bootstrap
#   script's stub value) reflects what's currently live.
# - scripts/set-role.sh changes a role's live backing model via the API
#   (POST /model/update), never by editing this file.
# - To find out what's ACTUALLY serving a role right now, query the
#   running proxy directly: `curl http://localhost:4000/v1/models` (or
#   `/model/info` for full litellm_params) — never read this file for
#   that answer.

model_list:
  # Static roles — not managed by set-role.sh, not DB-backed. These ARE
  # meant to be read here as the current truth.
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  # Scoped routes for pi-continue's handoff synthesis only (2026-08-03,
  # updated 2026-08-03 to add a second, big-moe-backed route).
  # pi-continue does a strict JSON.parse() on the summarizer model's output
  # with zero tolerance for a preamble, but "thinking" models reliably
  # prepend chain-of-thought prose before the JSON, which fails parsing
  # regardless of timeout length.
  #
  # Verified empirically (2026-08-03) against the qwen3.6-35b-a3b-mtp
  # backend + this litellm build: response_format:{type: json_object} (no
  # schema) is a NO-OP here — litellm's drop_params silently strips it
  # since this custom openai-compatible model isn't in litellm's known-
  # model-capabilities map, so the request goes through unconstrained and
  # the preamble comes back. A full response_format:{type: json_schema,
  # json_schema: {...}} DOES survive litellm and DOES make llama.cpp
  # grammar-constrain the "content" channel (the model's chain-of-thought
  # still flows into the separate "reasoning_content" field, which
  # pi-continue never reads) — confirmed with a live test producing clean,
  # schema-exact JSON with no preamble.
  #
  # The schema below is a hand-maintained mirror of pi-continue's internal
  # HISTORY_ARTIFACT_VERSION "pi-continue-artifacts/v4" shape (see
  # node_modules/pi-continue/extensions/continue/src/blocks.ts on the
  # pi-web box). If pi-continue is ever upgraded and that version string /
  # shape changes, this schema must be updated to match or synthesis will
  # start failing again (with a *different* validation error than today's).
  #
  # There are two routes below, one per model-size tier pi-continue might
  # use as its summarizerModel — each is a STATIC snapshot of a specific
  # backend and will NOT follow future set-role.sh reassignments of the
  # "medium-moe"/"big-moe" roles (same trade-off as governed_coder above).
  # Only pi-continue's summarizerModel should use these; forcing this
  # schema onto the shared dynamic roles would break every non-handoff use
  # of them.
  #
  # medium-moe-continue-json: qwen3.6-35b-a3b-mtp (127.0.0.1:8109) — the
  # original, empirically-verified route (renamed 2026-08-03 from
  # "coder-continue-json" when roles were renamed size/architecture-first;
  # same backend, same schema, name change only).
  - model_name: medium-moe-continue-json
    litellm_params:
      model: openai/qwen3.6-35b-a3b-mtp
      api_base: http://127.0.0.1:8109/v1
      api_key: "none"
      response_format:
        type: json_schema
        json_schema:
          name: pi_continue_artifacts_v4
          strict: true
          schema:
            type: object
            additionalProperties: false
            required: [version, brief, agentGuideUpdate]
            properties:
              version:
                enum: [pi-continue-artifacts/v4]
              brief:
                type: object
                additionalProperties: false
                required: [task, done_when, forbid, established, learned, open, next]
                properties:
                  task: { type: string }
                  done_when: { type: string }
                  forbid:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [rule, source]
                      properties:
                        rule: { type: string }
                        source: { type: string }
                  established:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [claim, evidence, basis, reopen]
                      properties:
                        claim: { type: string }
                        evidence: { type: string }
                        basis: { enum: [observed, test, output, user, doc] }
                        reopen: { type: string }
                  learned:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [lesson, source]
                      properties:
                        lesson: { type: string }
                        source: { type: string }
                  open:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [question, verifies]
                      properties:
                        question: { type: string }
                        verifies: { type: string }
                  next:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [action, outcome]
                      properties:
                        action: { type: string }
                        outcome: { type: string }
              agentGuideUpdate:
                type: object
                additionalProperties: false
                required: [content, reason]
                properties:
                  content:
                    anyOf:
                      - type: string
                      - type: "null"
                  reason: { type: string }

  # big-moe-continue-json: laguna-s-2.1-118b-q4km (127.0.0.1:8108) — added
  # 2026-08-03 as a second summarizerModel candidate. Laguna is a
  # different model than qwen3.6-35b-a3b-mtp; the JSON-schema-forcing
  # trick above is NOT assumed to work identically on it purely because it
  # worked on qwen — it must be (and was) empirically re-verified against
  # this exact backend before pi-continue's summarizerModel was pointed at
  # it. Laguna is also much larger/slower than qwen3.6-35b-a3b-mtp, which
  # is why it was avoided as the summarizer originally (before this
  # session's JSON-schema fix solved the actual parsing problem — speed
  # was never the blocker, unparseable preamble text was).
  - model_name: big-moe-continue-json
    litellm_params:
      model: openai/laguna-s-2.1-118b-q4km
      api_base: http://127.0.0.1:8108/v1
      api_key: "none"
      response_format:
        type: json_schema
        json_schema:
          name: pi_continue_artifacts_v4
          strict: true
          schema:
            type: object
            additionalProperties: false
            required: [version, brief, agentGuideUpdate]
            properties:
              version:
                enum: [pi-continue-artifacts/v4]
              brief:
                type: object
                additionalProperties: false
                required: [task, done_when, forbid, established, learned, open, next]
                properties:
                  task: { type: string }
                  done_when: { type: string }
                  forbid:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [rule, source]
                      properties:
                        rule: { type: string }
                        source: { type: string }
                  established:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [claim, evidence, basis, reopen]
                      properties:
                        claim: { type: string }
                        evidence: { type: string }
                        basis: { enum: [observed, test, output, user, doc] }
                        reopen: { type: string }
                  learned:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [lesson, source]
                      properties:
                        lesson: { type: string }
                        source: { type: string }
                  open:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [question, verifies]
                      properties:
                        question: { type: string }
                        verifies: { type: string }
                  next:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [action, outcome]
                      properties:
                        action: { type: string }
                        outcome: { type: string }
              agentGuideUpdate:
                type: object
                additionalProperties: false
                required: [content, reason]
                properties:
                  content:
                    anyOf:
                      - type: string
                      - type: "null"
                  reason: { type: string }

  # All vLLM builds — fixed ports, available for set-role.sh routing.
