  # ---------------------------------------------------------------------------
  # llama.cpp-server build — port 8100
  # ---------------------------------------------------------------------------
  # Engine: llamacpp-vulkan-radv-server-v1 (llama-server, OpenAI-compatible
  # HTTP API with continuous batching / parallel slots). Only llamacpp build
  # that can run as a standing service — the other 10 use llama-bench
  # (single-shot benchmarking tool that exits after running).
  qwen3.6-27b--llamacpp-vulkan-radv-server-v1:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: qwen3.6-27b--llamacpp-vulkan-radv-server-v1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "26"
      - "303"
    volumes:
      - /var/lib/ai-models/ollama-qwen3.6-27b:/models:ro
    command: >
      llama-server
      -m /models/Qwen3.6-27B-Q4_K_M.gguf
      -ngl 999
      -fa 1
      -lm none
      -cb
      -kvu
      --host 0.0.0.0
      --port 8080
      -np 4
      -c 32768
      --metrics
    ports:
      - "127.0.0.1:8100:8080"

