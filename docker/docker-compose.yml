  # ---------------------------------------------------------------------------
  # Ollama — shared single instance, port 11434
  # ---------------------------------------------------------------------------
  # Ollama can only serve one instance on one port. Model switching is
  # API-level: `ollama run <model>` or `ollama pull <model>` via the
  # container's API. Individual catalog builds document which model to use.
  # Plain tag, NOT :0.17.7-rocm — the -rocm tag crashes on gfx1151 and
  # doesn't even bundle Vulkan libs.
  ollama:
    image: ollama/ollama:0.17.7
    container_name: ollama
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    environment:
      - OLLAMA_VULKAN=1
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "26"
      - "303"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - /var/lib/ai-models:/gguf-source:ro

  # ---------------------------------------------------------------------------
  # Infrastructure — role-agnostic services
  # ---------------------------------------------------------------------------

  # Unified API Gateway — aliases role names to concrete model ports.
  # Virtual keys (sk-chris-master, sk-drew-edge) are generated at runtime
  # via /key/generate, not declared in config.yaml.
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm_user
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    network_mode: host
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
      - ./litellm/jsonl_logger.py:/app/jsonl_logger.py
      - ./litellm/logs:/app/logs
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://litellm_user:${LITELLM_DB_PASSWORD}@127.0.0.1:5432/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - litellm-db

  # web_search backend (per M-038, pi-web; originally deployed alongside the
  # now-decommissioned Turnstone service too). `search.formats: [html, json]`
  # in ./searxng/settings.yml is the one setting that actually matters: a
  # stock SearxNG ships html-only and 403s on format=json, the most common
  # new-deployment failure — internal-network-only, no UI exposed to anyone.
  #
  # 127.0.0.1:8091 publish (M-038, 2026-07-31): pi-web is `network_mode:
  # host`, so it has no bridge DNS at all — same class of problem the
  # litellm/prometheus host-networking fix solved earlier this session, but
  # the mirror-image direction: there, the *caller* needed host networking to
  # reach a 127.0.0.1-bound *target*; here the *caller* (pi-web) is already
  # host-networked and the *target* (searxng) needs a loopback-bound publish
  # so the host namespace can see it. Confirmed before adding this: the host
  # can already reach searxng directly via its bridge IP (`docker network
  # inspect docker_default`), but that IP isn't guaranteed stable across
  # container recreation, so publishing to a fixed 127.0.0.1 port (matching
  # every other backend service in this file) is the durable fix rather than
  # hardcoding the bridge IP. 8091 chosen as the next free loopback port
  # outside the 8000-8012 (vLLM) / 8100-8199 (llama.cpp) ranges.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Telemetry & Observability Stack
  # network_mode: host (matching litellm's own reason for the same thing)
  # — every model-serving port in this stack is deliberately bound to
  # 127.0.0.1 only, not exposed on the LAN (see the port-keyed scrape
  # targets in prometheus.yml). extra_hosts/host.docker.internal reaches
  # the host via its *bridge* gateway IP, which a 127.0.0.1-only listener
  # correctly refuses — confirmed directly (connection refused from
  # host.docker.internal, works fine from the host's own loopback).
  # Host networking is the only way to reach those ports without loosening
  # their actual bind address, which would be a real security regression.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - node-exporter

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    pid: host
    # Now-host-networked prometheus can't resolve bridge-network DNS names
    # ("node-exporter:9100") anymore — needs an actual published port,
    # loopback-only like every other monitoring/model port in this stack.
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node-exporter-textfile:/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    # prometheus moved to network_mode: host (see its own comment) so it
    # dropped off the bridge network entirely — Grafana (still bridge-
    # networked) can no longer resolve "prometheus" via Docker's embedded
    # DNS. Reach it via host.docker.internal instead; unlike the model-
    # serving ports, prometheus itself isn't restricted to 127.0.0.1, so
    # this actually works (real difference from the host.docker.internal
    # attempt that failed for the model ports in the prior PR).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus

  # Browser chat UI — points at LiteLLM, not any model server directly.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    #labels:
      #com.local-ai-machine.always-up: "true"
    ports:
      - "3001:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_AUTH=true
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - litellm

  # pi-web (github.com/agegr/pi-web): community web UI for the pi coding
  # agent. Originally deployed alongside our own bespoke pi-agent-supervisor
  # (M-030..M-034) for side-by-side comparison; that comparison is done -
  # Chris decided pi-web is the way forward (M-037) and
  # pi-agent-supervisor was fully decommissioned (container removed,
  # volume removed, service block and pi-agent/ source deleted). Same
  # locally-hosted `coder` model via litellm either way. Port 30141
  # is pi-web's own documented default, published directly (no
  # 127.0.0.1: prefix) for LAN/phone reachability like the rest of this
  # experiment's stack. No auth (PI_WEB_PASSWORD unset) - same explicit
  # no-auth choice as everything else in this experiment; pi-web's own
  # README explicitly warns this is a high-privilege agent surface, so
  # this stays LAN-only, never exposed past this network boundary.
  pi-web:
    build:
      context: ../pi-web
    image: local-ai-machine/pi-web:latest
    container_name: pi-web
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    network_mode: host
    group_add:
      - "131"  # docker group GID (matches host's docker group)
    environment:
      PI_CODING_AGENT_DIR: /data/pi-agent-config
      PORT: "30141"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # pi-claude-bridge (M-039): the Claude Agent SDK always spawns
      # `claude` with --dangerously-skip-permissions (no interactive
      # approval flow exists in a headless subprocess), which Claude
      # Code's own CLI refuses to honor when running as root - every
      # service in this compose file runs as root (no USER directive
      # anywhere). IS_SANDBOX=1 is Claude Code's own documented escape
      # hatch for exactly this (containerized/CI, always-root
      # environments). Confirmed live (M-039 decision log) this is the
      # sole remaining blocker - reproduced the failure without it,
      # confirmed success with it, both isolated from the bridge
      # entirely and through the real provider path. Chris's explicit
      # go-ahead (2026-07-31) after being walked through what this
      # actually changes: it doesn't grant NEW tool access beyond what
      # this container already has for any model (bash/write/docker.sock/
      # SSH key are already available to whatever model is selected) - it
      # only lets the claude subprocess start at all as root. Real
      # tightening lever if wanted later: askClaude.allowFullMode: false
      # in claude-bridge.json, independent of this setting.
      IS_SANDBOX: "1"
      # pi-claude-bridge auth (M-039, superseding the copied
      # ~/.claude/.credentials.json approach below): that file-copy
      # approach was confirmed NOT to work - reproduced live, in
      # isolation on Chris's own Mac, that a bare-credentials-file
      # environment (no full interactive-session state) hits "401 OAuth
      # access token has been revoked" via the Agent SDK specifically,
      # even though the identical file works fine through the plain
      # `claude` CLI. Root cause not fully identified (some piece of
      # interactive-login-only state the SDK's own auth-profile-fetch
      # step needs, isolated from Keychain access via a controlled
      # local test - not simply file content that can be copied).
      # `claude setup-token` is the actual documented fix for exactly
      # this class of problem: a long-lived (1-year), subscription-
      # backed token purpose-built for headless/CI use
      # (CLAUDE_CODE_OAUTH_TOKEN env var, "sk-ant-oat01-..." format,
      # confirmed via Anthropic's own docs). Generated by Chris
      # 2026-07-31, stored in docker/.env (same convention as
      # LITELLM_MASTER_KEY/GH_TOKEN).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # @juicesharp/rpiv-web-tools (M-038): reuses the SearxNG instance
      # already deployed for Turnstone rather than a second search stack.
      WEB_SEARCH_PROVIDER: searxng
      SEARXNG_URL: http://127.0.0.1:8091
      # GH_TOKEN (2026-07-31): same token/scope already used by turnstone
      # above (Chris's personal gh CLI token, broad "repo" scope - pi-web
      # has no per-project credential scoping either, so a narrower token
      # wouldn't buy real isolation here any more than it did there).
      # Covers what SSH can't: GitHub's REST/GraphQL API (gh pr create,
      # etc.) doesn't accept SSH keys at all.
      GH_TOKEN: ${GH_TOKEN}
    volumes:
      - pi-web-data:/data
      # Chris's explicit instruction: mount the whole home directory (not
      # individual project dirs like pi-agent-supervisor's /workspace/*)
      # so pi-web's own project/session browser and git-worktree switcher
      # can discover any project under it, matching how it actually
      # expects to be used (it reads real session files' recorded cwd
      # paths - mounting at the SAME absolute host path, not a /workspace
      # remap, avoids any path mismatch between what a session file says
      # and what's actually on disk in the container).
      - /home/chris:/home/chris
      # Docker socket mount (2026-07-31): enables docker CLI inside pi-web
      # container to control host Docker - same privilege model as
      # turnstone already has (accepted deliberately, not default).
      - /var/run/docker.sock:/var/run/docker.sock
      # GitHub SSH deploy key (2026-07-31, M-044 superseding the /root/.ssh
      # stopgap): pi-web now runs as the `node` user (uid 1000, matching
      # host chris) with HOME=/home/chris explicitly set in the Dockerfile
      # - the whole-home-dir mount above already puts
      # /home/chris/.ssh/github_deploy_key on disk at the SAME path git/ssh
      # actually look at by default now, so no separate SSH-specific mount
      # is needed at all (unlike turnstone, which doesn't mount its user's
      # whole home dir and so still needs the explicit 3-file mount).
      # Same fleet-convention global context file as pi-agent-supervisor -
      # see that service's comment above.
      - ./agentic-fleet-AGENTS.md:/data/pi-agent-config/AGENTS.md:ro
      # pi-core's own native Agent Skills mechanism (confirmed from
      # @earendil-works/pi-coding-agent's core/skills.js: SKILL.md files
      # under $PI_CODING_AGENT_DIR/skills/<name>/ are loaded into every
      # session's system prompt automatically). Read-only mount, same
      # git-is-the-source-of-truth pattern as AGENTS.md above (unlike
      # models.json, which deliberately allows in-UI edits and is only
      # seeded once) - a skill should always match what's committed.
      # First skill (M-044 follow-up, 2026-07-31): adding-tools-to-pi-web,
      # documents how a pi session itself can request/add a missing
      # command or extension.
      - ../pi-web/skills:/data/pi-agent-config/skills:ro
    depends_on:
      - litellm

  omp:
    build:
      context: ../oh-my-pi/
    image: ghcr.io/can1357/oh-my-pi:latest
    container_name: oh-my-pi
    user: "1000:1000"
    tty: true
    stdin_open: true
    volumes:
      - /home/chris/turnstone-workspace/printer-dashboard:/work
      - ~/.omp:/home/node/.omp
      - /home/chris/.ssh:/home/node/.ssh
      - /var/run/docker.sock:/var/run/docker.sock
    #labels:
      #com.local-ai-machine.always-up: "true"
    network_mode: host
    group_add:
      - "131"  # docker group GID (matches host's docker group)
    environment:
      # Relative name, not absolute: omp resolves the config root as
      # path.join(os.homedir(), PI_CONFIG_DIR), so ".omp" lands on the
      # ~/.omp:/home/omp/.omp mount above.
      - PI_CONFIG_DIR=.omp
      # Seed-time substitution target for models.seed.yml.tmpl's
      # __LITELLM_MASTER_KEY__ placeholder (oh-my-pi/docker-entrypoint.sh).
      # Same env value every litellm-facing service already gets.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    working_dir: /work
    # `cli` is a subcommand of the omp binary, not a PATH executable; our
    # Dockerfile entrypoint is the seed script (not upstream's `omp`), so the
    # subcommand must be dispatched through the binary explicitly.
    command: ["omp"]
    extra_hosts:
      # Reach the host-networked litellm proxy (port 4000) from this
      # bridge-networked container — same pattern as turnstone.
      - "host.docker.internal:host-gateway"
    depends_on:
      - litellm

  jmfederico-pi-web:
    build:
      context: ../jmfederico-pi-web/
    image: ghcr.io/jmfederico/pi-web:latest
    container_name: pi-web
    user: "1000:1000"
    tty: true
    stdin_open: true
    ports:
      - "8080:3000" # Expose the Next.js UI port
    volumes:
      - /home/chris/turnstone-workspace/printer-dashboard:/work
      - ~/.pi-web:/home/piweb/.pi-web
      - /home/chris/.ssh:/home/piweb/.ssh
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.local-ai-machine.always-up: "true"
    group_add:
      - "131"  # docker group GID
    environment:
      # Absolute path for pi-web config directory
      - PI_CODING_AGENT_DIR=/home/piweb/.pi-web
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # @juicesharp/rpiv-web-tools (see settings.seed.json's packages
      # array): reuses the SearxNG instance already running for the other
      # pi-web variant (M-038) rather than a second search stack. That
      # variant is network_mode: host and reaches searxng via its
      # loopback-only host publish (127.0.0.1:8091) - this service is
      # bridge-networked instead, and host.docker.internal can't see a
      # 127.0.0.1-bound host port at all (confirmed live: ECONNREFUSED).
      # Since both services already sit on the same default bridge network
      # (br-localai), container-to-container DNS + searxng's actual
      # internal port (8080, independent of how it's published to the
      # host) works directly - confirmed live (200 from /healthz).
      - WEB_SEARCH_PROVIDER=searxng
      - SEARXNG_URL=http://searxng:8080
    working_dir: /work
    command: ["bash", "-c", "pi-web-sessiond & PI_WEB_HOST=0.0.0.0 PI_WEB_PORT=3000 pi-web-server"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - litellm

