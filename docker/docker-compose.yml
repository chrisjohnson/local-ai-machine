  # MTP (multi-token-prediction) speculative-decoding variant of
  # qwen3.6-35b-a3b, using the MTP-tensor-bearing GGUF (a separate download
  # from the plain quant — see configuration.nix). --spec-type draft-mtp
  # requires -np/--parallel 1 (MTP supports only a single server slot).
  # For comparison against the already-benchmarked plain llama.cpp build
  # (qwen3.6-35b-a3b--llamacpp-vulkan-radv, tg128 63.43 tok/s).
