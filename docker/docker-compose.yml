  # ---------------------------------------------------------------------------
  # Ollama — shared single instance, port 11434
  # ---------------------------------------------------------------------------
  # Ollama can only serve one instance on one port. Model switching is
  # API-level: `ollama run <model>` or `ollama pull <model>` via the
  # container's API. Individual catalog builds document which model to use.
  # Plain tag, NOT :0.17.7-rocm — the -rocm tag crashes on gfx1151 and
  # doesn't even bundle Vulkan libs.
  ollama:
    image: ollama/ollama:0.17.7
    container_name: ollama
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    environment:
      - OLLAMA_VULKAN=1
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "26"
      - "303"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - /var/lib/ai-models:/gguf-source:ro

  # ---------------------------------------------------------------------------
  # Infrastructure — role-agnostic services
  # ---------------------------------------------------------------------------

  # Unified API Gateway — aliases role names to concrete model ports.
  # Virtual keys (sk-chris-master, sk-drew-edge) are generated at runtime
  # via /key/generate, not declared in config.yaml.
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm_user
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    network_mode: host
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://litellm_user:${LITELLM_DB_PASSWORD}@127.0.0.1:5432/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - litellm-db

  # Turnstone Database & Governance Server.
  turnstone-db:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    container_name: turnstone-db
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    environment:
      POSTGRES_DB: turnstone
      POSTGRES_USER: turnstone
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - turnstone_postgres_data:/var/lib/postgresql/data

  # Real project + Docker access for Turnstone-orchestrated agents, per
  # Chris's explicit choice (2026-07-30) — the alternative (running
  # turnstone-server on his Mac instead, where Docker Desktop and project
  # checkouts already live) was raised and declined. This grants the
  # container host-level Docker control via the mounted socket — a real
  # privilege-escalation vector, not just a config tweak: anything that
  # can run `docker run --privileged -v /:/host ...` through this socket
  # can trivially root the host. Accepted deliberately, not a default.
  turnstone:
    build:
      context: ./turnstone
    image: local-ai-machine/turnstone-with-docker:latest
    container_name: turnstone-server
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    command: ["turnstone-server", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      TURNSTONE_JWT_SECRET: ${TURNSTONE_JWT_SECRET}
      TURNSTONE_DB_BACKEND: postgresql
      TURNSTONE_DB_URL: postgresql+psycopg://turnstone:${DB_PASSWORD}@turnstone-db:5432/turnstone
      LLM_BASE_URL: http://host.docker.internal:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      # gh CLI auth (PR creation) — SSH covers git push/clone but not
      # GitHub's API, which doesn't accept SSH keys at all. Chris's own
      # personal gh token (broad "repo" scope, not narrowed to
      # printer-dashboard — Turnstone has no per-project credential
      # scoping mechanism, confirmed by reading its own "Projects" feature
      # source, which is ACL/visibility-only, not env/secret isolation —
      # so a narrower token wouldn't have bought real isolation anyway).
      # Chris's explicit choice after that was made clear.
      GH_TOKEN: ${GH_TOKEN}
      # Enables the web_search tool — absent this, it's silently removed
      # from the model's tool list entirely (no error, just not offered;
      # confirmed by reading core/web_search.py). No secret involved:
      # searxng below has no published port and no UI, matching
      # Turnstone's own bundled reference deployment.
      TURNSTONE_SEARXNG_URL: http://searxng:8080
    # group_add "131" = the host's docker group GID (confirmed via
    # `getent group docker` — not portable across hosts by name, same
    # numeric-GID pattern this file already uses for /dev/kfd, /dev/dri).
    group_add:
      - "131"
    volumes:
      - ./turnstone/config.toml:/home/turnstone/.config/turnstone/config.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/chris/turnstone-workspace/printer-dashboard:/workspace/printer-dashboard
      # SSH key already used elsewhere on this box for GitHub access
      # (same one local-ai-machine's own repo operations use) — covers
      # git push/clone. Host chris (uid 1000) and container turnstone
      # (uid 1000) match numerically, so the key's 0600 permissions read
      # correctly as owner-only inside the container too; confirmed
      # before mounting, not assumed.
      - /home/chris/.ssh/github_deploy_key:/home/turnstone/.ssh/github_deploy_key:ro
      - /home/chris/.ssh/known_hosts:/home/turnstone/.ssh/known_hosts:ro
      - /home/chris/.ssh/config:/home/turnstone/.ssh/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - turnstone-db
      - searxng

  # web_search backend for turnstone (and, per M-038, pi-web). Config copied
  # verbatim from Turnstone's own bundled reference deploy
  # (deploy/searxng/settings.yml inside the image) — internal-network-only,
  # no UI exposed to anyone. `search.formats: [html, json]` in that file is
  # the one setting that actually matters: a stock SearxNG ships html-only
  # and 403s on format=json, which is the most common new-deployment failure
  # per Turnstone's own config comments.
  #
  # 127.0.0.1:8091 publish (M-038, 2026-07-31): Turnstone reaches this
  # container by its bridge DNS name (`searxng`) since it's bridge-networked
  # itself. pi-web is `network_mode: host` though, so it has no bridge DNS at
  # all — same class of problem the litellm/prometheus host-networking fix
  # solved earlier this session, but the mirror-image direction: there, the
  # *caller* needed host networking to reach a 127.0.0.1-bound *target*; here
  # the *caller* (pi-web) is already host-networked and the *target*
  # (searxng) needs a loopback-bound publish so the host namespace can see
  # it. Confirmed before adding this: the host can already reach searxng
  # directly via its bridge IP (`docker network inspect docker_default`),
  # but that IP isn't guaranteed stable across container recreation, so
  # publishing to a fixed 127.0.0.1 port (matching every other backend
  # service in this file) is the durable fix rather than hardcoding the
  # bridge IP. 8091 chosen as the next free loopback port outside the
  # 8000-8012 (vLLM) / 8100-8199 (llama.cpp) ranges and clear of 8090
  # (turnstone-console).
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # turnstone-console — full admin/settings surface (judge.*, memory.*,
  # etc. — anything beyond interface.* prefs, which turnstone-server's own
  # limited settings endpoint handles). Turnstone's own reference compose
  # deliberately does NOT publish this port directly ("reach it ONLY
  # through Caddy") since it's more sensitive than the chat server — same
  # reasoning this project already applies to model-serving ports: bound
  # to 127.0.0.1 only, not the LAN. Reach via SSH tunnel, not directly.
  turnstone-console:
    image: ghcr.io/turnstonelabs/turnstone:latest
    container_name: turnstone-console
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    command: ["turnstone-console", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      TURNSTONE_JWT_SECRET: ${TURNSTONE_JWT_SECRET}
      TURNSTONE_DB_BACKEND: postgresql
      TURNSTONE_DB_URL: postgresql+psycopg://turnstone:${DB_PASSWORD}@turnstone-db:5432/turnstone
    depends_on:
      - turnstone-db
      - litellm

  # Telemetry & Observability Stack
  # network_mode: host (matching litellm's own reason for the same thing)
  # — every model-serving port in this stack is deliberately bound to
  # 127.0.0.1 only, not exposed on the LAN (see the port-keyed scrape
  # targets in prometheus.yml). extra_hosts/host.docker.internal reaches
  # the host via its *bridge* gateway IP, which a 127.0.0.1-only listener
  # correctly refuses — confirmed directly (connection refused from
  # host.docker.internal, works fine from the host's own loopback).
  # Host networking is the only way to reach those ports without loosening
  # their actual bind address, which would be a real security regression.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - node-exporter

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    pid: host
    # Now-host-networked prometheus can't resolve bridge-network DNS names
    # ("node-exporter:9100") anymore — needs an actual published port,
    # loopback-only like every other monitoring/model port in this stack.
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node-exporter-textfile:/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    # prometheus moved to network_mode: host (see its own comment) so it
    # dropped off the bridge network entirely — Grafana (still bridge-
    # networked) can no longer resolve "prometheus" via Docker's embedded
    # DNS. Reach it via host.docker.internal instead; unlike the model-
    # serving ports, prometheus itself isn't restricted to 127.0.0.1, so
    # this actually works (real difference from the host.docker.internal
    # attempt that failed for the model ports in the prior PR).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus

  # Browser chat UI — points at LiteLLM, not any model server directly.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    ports:
      - "3001:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_AUTH=true
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - litellm

  # pi-web (github.com/agegr/pi-web): community web UI for the pi coding
  # agent. Originally deployed alongside our own bespoke pi-agent-supervisor
  # (M-030..M-034) for side-by-side comparison; that comparison is done -
  # Chris decided pi-web is the way forward (M-037) and
  # pi-agent-supervisor was fully decommissioned (container removed,
  # volume removed, service block and pi-agent/ source deleted). Same
  # locally-hosted `coder` model via litellm either way. Port 30141
  # is pi-web's own documented default, published directly (no
  # 127.0.0.1: prefix) for LAN/phone reachability like the rest of this
  # experiment's stack. No auth (PI_WEB_PASSWORD unset) - same explicit
  # no-auth choice as everything else in this experiment; pi-web's own
  # README explicitly warns this is a high-privilege agent surface, so
  # this stays LAN-only, never exposed past this network boundary.
  pi-web:
    build:
      context: ../pi-web
    image: local-ai-machine/pi-web:latest
    container_name: pi-web
    restart: unless-stopped
    labels:
      com.local-ai-machine.always-up: "true"
    network_mode: host
    environment:
      PI_CODING_AGENT_DIR: /data/pi-agent-config
      PORT: "30141"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # pi-claude-bridge (M-039): the Claude Agent SDK always spawns
      # `claude` with --dangerously-skip-permissions (no interactive
      # approval flow exists in a headless subprocess), which Claude
      # Code's own CLI refuses to honor when running as root - every
      # service in this compose file runs as root (no USER directive
      # anywhere). IS_SANDBOX=1 is Claude Code's own documented escape
      # hatch for exactly this (containerized/CI, always-root
      # environments). Confirmed live (M-039 decision log) this is the
      # sole remaining blocker - reproduced the failure without it,
      # confirmed success with it, both isolated from the bridge
      # entirely and through the real provider path. Chris's explicit
      # go-ahead (2026-07-31) after being walked through what this
      # actually changes: it doesn't grant NEW tool access beyond what
      # this container already has for any model (bash/write/docker.sock/
      # SSH key are already available to whatever model is selected) - it
      # only lets the claude subprocess start at all as root. Real
      # tightening lever if wanted later: askClaude.allowFullMode: false
      # in claude-bridge.json, independent of this setting.
      IS_SANDBOX: "1"
      # @juicesharp/rpiv-web-tools (M-038): reuses the SearxNG instance
      # already deployed for Turnstone rather than a second search stack.
      WEB_SEARCH_PROVIDER: searxng
      SEARXNG_URL: http://127.0.0.1:8091
    volumes:
      - pi-web-data:/data
      # Chris's explicit instruction: mount the whole home directory (not
      # individual project dirs like pi-agent-supervisor's /workspace/*)
      # so pi-web's own project/session browser and git-worktree switcher
      # can discover any project under it, matching how it actually
      # expects to be used (it reads real session files' recorded cwd
      # paths - mounting at the SAME absolute host path, not a /workspace
      # remap, avoids any path mismatch between what a session file says
      # and what's actually on disk in the container).
      - /home/chris:/home/chris
      # Same fleet-convention global context file as pi-agent-supervisor -
      # see that service's comment above.
      - ./agentic-fleet-AGENTS.md:/data/pi-agent-config/AGENTS.md:ro
      # pi-claude-bridge (M-039): Chris's own Claude Code OAuth credentials,
      # copied to the host at this path already (raw file transfer, his own
      # explicit confirmation, never printed/materialized along the way).
      # Mounted read-only at a staging path rather than directly at
      # /root/.claude/.credentials.json - same ownership mismatch already
      # hit twice tonight (container runs as root; this file is owned by
      # uid 1000 on the host). docker-entrypoint.sh copies it into
      # /root/.claude with root ownership + chmod 600 at startup.
      - /home/chris/secrets/claude-code-credentials.json:/run/claude-secrets/claude-code-credentials.json:ro
    depends_on:
      - litellm

volumes:
  turnstone_postgres_data:
  searxng-cache:
  litellm_postgres_data:
  pi-web-data:
  vllm-qwen3.6-35b-a3b-cache:
  vllm-qwen3.5-4b-cache:
  vllm-qwen3.6-27b-cache:
  vllm-glm-4.7-flash-awq-cache:
  vllm-qwen3-coder-next-gptq4bit-cache:
  vllm-gpt-oss-20b-cache:
  vllm-gpt-oss-120b-cache:
  vllm-qwen3.5-122b-a10b-awq4bit-cache:
  vllm-gemma-4-26b-a4b-it-cache:
  vllm-gemma-4-31b-it-cache:
  vllm-qwen2.5-vl-7b-instruct-cache:
  vllm-north-mini-code-1.0-w4a16-cache:
  open_webui_data:
  grafana_data:
  ollama_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-localai
