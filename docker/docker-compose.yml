  # GLM-4.7-Flash judge model (M-040). Chris asked for "the strongest"
  # judge candidate — per the catalog's own benchmark record, that's this
  # llama.cpp/GGUF build, not the AWQ/vLLM one already registered in
  # litellm (glm-4.7-flash-awq, port 8003): 20/22 on seven-tier-coding-v2
  # vs. 18/22, and 70.1 tok/s vs. ~19-33 tok/s. Single slot (-np default 1,
  # no -cb/-kvu) since a judge doesn't need concurrent-serving complexity -
  # matches the MTP coder service's simplicity, not the 4-slot server
  # engine's template. -lm none matches the exact flags the catalog's own
  # benchmark-of-record run used (llamacpp-vulkan-radv-v1's common_flags),
  # for as close a match to the measured 70.1 tok/s as possible.
