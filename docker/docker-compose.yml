  # vLLM builds (kyuz0/vllm-therock-gfx1151) — ports 8000-8012
  # ---------------------------------------------------------------------------
  # Common vLLM config (from catalog/engines/vllm-therock-gfx1151-v1.yaml):
  #   image: kyuz0/vllm-therock-gfx1151:latest
  #   devices: /dev/kfd, /dev/dri
  #   group_add: video, render (named groups — image has them)
  #   security_opt: seccomp:unconfined
  #   ipc: host
  #   volumes: /var/lib/ai-models:/models
  #   common_flags: --host 0.0.0.0, --trust-remote-code, --enable-prefix-caching,
  #                 --dtype auto, --tensor-parallel-size 1
  # Each service below adds build-specific flags from its catalog entry.
  # Container always listens on :8000 internally; host port varies.

  qwen3.6-35b-a3b--vllm-therock-gfx1151-v1:
    image: docker.io/kyuz0/vllm-therock-gfx1151:latest
    container_name: qwen3.6-35b-a3b--vllm-therock-gfx1151-v1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
    ipc: host
    volumes:
      - /var/lib/ai-models:/models
      - vllm-qwen3.6-35b-a3b-cache:/root/.cache/vllm
    command: >
      vllm serve /models/qwen3.6-35b-a3b
      --served-model-name qwen3.6-35b-a3b
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.70
      --dtype auto
      --trust-remote-code
      --max-num-seqs 64
      --enable-prefix-caching
      --max-model-len 131072
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
    ports:
      - "127.0.0.1:8000:8000"

