      -ngl 999
      -fa 1
      --spec-type draft-mtp
      --spec-draft-n-max 3
      -np 1
      -c 131072
      -n 8192
      --host 0.0.0.0
      --port 8080
      -a qwen3.6-35b-a3b-mtp
