version: '3.8'

# Two-tier design (M-001): every verified model+engine build is its own compose
# service with a fixed port. LiteLLM aliases role names (coder, judge) to
# whichever localhost:<port> is the current pick — switching roles is a LiteLLM
# config edit + reload, not a compose change.
#
# Port allocation (per-engine-family, sequential within family):
#   vLLM builds:          8000-8099
#   llama.cpp-server:     8100-8199
#   Ollama:               11434 (single shared instance, model switch via API)
#   Infrastructure:       4000 (LiteLLM), 8080 (Turnstone), 9090 (Prometheus),
#                         3000 (Grafana), 3001 (Open WebUI)
#
# All model-serving ports bind to 127.0.0.1 only. LiteLLM uses
# network_mode: host to reach them directly. See vllm-primary comment
# block (now removed, preserved in git history) for the NixOS firewall
# reasoning. Reach via SSH tunnel or LiteLLM on 4000.
#
# Only start the service you want — everything else stays defined-but-stopped.
# GPU contention means at most one vLLM + one llama-server can co-reside;
# Ollama is always safe alongside either (small GPU footprint).
#
# Always-up vs. exclusive/benchmarkable (see catalog/OPERATIONS.md for full
# rationale): infra services below carry
#   labels:
#     com.local-ai-machine.always-up: "true"
# scripts/benchmark_orchestrator.py stops every service WITHOUT that label
# once for the whole sweep (not per-build — that caused a real full-system
# hang, 2026-07-29), then restores exactly whichever ones were running
# beforehand at the very end. New model-serving builds need no label at
# all — they're exclusive/stoppable by default; only genuine infra should
# ever carry always-up: "true".
#
# Deliberately no `restart: unless-stopped` on model-serving services
# (2026-07-29): a hard reboot caught mid-sweep brought every model
# container back up simultaneously (~111GB/124GB used), since none of
# them were in an explicit "stopped" state at the moment of the crash.
# Infra services below keep the restart policy — no GPU-contention risk
# there. Which model should auto-start on boot (if any) is an open
# question, deferred until the sweep/exclusivity design is more settled.
#
# --gpu-memory-utilization: judge-sized models (roughly <25B — the ones
# almost always run co-resident alongside a larger candidate model, e.g.
# qwen3.5-4b-judge at 0.20, qwen2.5-vl-7b-instruct at 0.20 for the M-024
# LLM-judge role) should carry an explicit low cap so they don't starve
# whatever they're running alongside — vLLM's default (0.90) assumes it
# owns the whole GPU, which is only true for a standalone candidate. Larger
# models that might reasonably serve standalone (no separate judge needed)
# intentionally don't get a cap here — see M-025 for the followup pass
# systematically reviewing which services need one, including borderline
# MoE cases where total params exceed the ~25B judge threshold but active
# params don't.

