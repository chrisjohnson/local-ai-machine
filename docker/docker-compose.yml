      - /dev/dri:/dev/dri
    group_add:
      - "26"
      - "303"
    volumes:
      - /var/lib/ai-models/ollama-qwen3.6-27b:/models:ro
    command: >
      llama-server
      -m /models/Qwen3.6-27B-Q4_K_M.gguf
      -ngl 999
      -fa 1
      -lm none
      -cb
      -kvu
      --host 0.0.0.0
      --port 8080
      -np 4
      -c 32768
      --metrics
    ports:
